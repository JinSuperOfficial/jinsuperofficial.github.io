  /* ============ 更新日志（悬浮窗） ============
     数据目录和 data/hwk/ 同级：/class/data/hwk-log/
       · index.json —— 目录：一个数组，也可以写成 { "entries": [...] }；
                       新的写在**最前面**；每条要么在索引里直接写全，
                       要么只写个 file 指向同目录下的日志文件
       · 每条日志一个文件 —— 写好就不再动（历史只增不改）
     页面**只读**：从不写、从不改，历史条目永远是原样。
     条目字段：date / title / version / tags[] / summary / sections[{heading, items[]}] / note
     行内支持 **粗体**、*斜体*、`代码`（复用正文那套轻量 Markdown）。 */
  const LOG_DIR   = './data/hwk-log/';
  const LOG_INDEX = LOG_DIR + 'index.json';

  const logWin    = document.getElementById('logWin');
  const logList   = document.getElementById('logList');
  const logDetail = document.getElementById('logDetail');
  const logCount  = document.getElementById('logCount');
  const logBtn    = document.getElementById('logBtn');
  const logClose  = document.getElementById('logClose');

  let logEntries  = null;   /* 目录（懒加载一次，之后不再请求） */
  let logActive   = 0;      /* 现在看的是第几条 */
  let logLastFocus = null;

  /* 和数据文件一样宽容：允许多余的逗号（手写的 JSON 常犯） */
  async function fetchJson(url){
    const res = await fetch(url, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = (await res.text()).replace(/,\s*([}\]])/g, '$1');
    return JSON.parse(text);
  }

  async function loadLogIndex(){
    if(logEntries) return logEntries;
    const json = await fetchJson(LOG_INDEX);
    const list = Array.isArray(json) ? json
               : (json && Array.isArray(json.entries) ? json.entries : []);
    logEntries = list.filter(e => e && typeof e === 'object');
    return logEntries;
  }

  /* 索引里只写了 file 的，按需把那一条读进来（只在内存里合并，不写回文件） */
  async function loadLogEntry(entry){
    if(entry.sections || entry.body || !entry.file) return entry;
    const one = await fetchJson(LOG_DIR + entry.file);
    return Object.assign({}, entry, one && typeof one === 'object' ? one : {});
  }

  function renderLogEntry(e){
    const out = [];
    out.push(`<h3 class="log-h">${esc(e.title || '（无标题）')}</h3>`);

    const meta = [];
    if(e.version) meta.push(`<span class="log-ver">${esc(e.version)}</span>`);
    if(e.date)    meta.push(`<span>${esc(e.date)}</span>`);
    (Array.isArray(e.tags) ? e.tags : []).forEach(t => meta.push(`<span class="log-tag">${esc(t)}</span>`));
    if(meta.length) out.push(`<div class="log-meta">${meta.join('')}</div>`);

    if(e.summary) out.push(`<p class="log-sum">${parseInlineMD(String(e.summary))}</p>`);

    const secs = Array.isArray(e.sections) ? e.sections : [];
    secs.forEach(sec => {
      if(!sec || typeof sec !== 'object') return;
      const items = Array.isArray(sec.items) ? sec.items
                  : (sec.items === undefined || sec.items === null ? [] : [sec.items]);
      out.push('<section class="log-sec">');
      if(sec.heading) out.push(`<h4>${esc(sec.heading)}</h4>`);
      if(items.length){
        out.push('<ul>' + items.map(it => `<li>${parseInlineMD(String(it))}</li>`).join('') + '</ul>');
      }
      out.push('</section>');
    });

    /* 没写 sections 的，也可以直接给一段 body（空行分段，段内换行当空格） */
    if(!secs.length && e.body){
      String(e.body).split(/\n{2,}/).map(s => s.trim()).filter(Boolean)
        .forEach(p => out.push(`<p class="log-sum">${parseInlineMD(p.replace(/\s*\n\s*/g, ' '))}</p>`));
    }

    if(e.note) out.push(`<p class="log-note">${parseInlineMD(String(e.note))}</p>`);
    return out.join('');
  }

  async function selectLog(i){
    const list = logEntries || [];
    if(!list.length) return;
    logActive = Math.max(0, Math.min(i, list.length - 1));

    Array.prototype.forEach.call(logList.children, (el, k) => {
      el.setAttribute('aria-selected', k === logActive ? 'true' : 'false');
    });
    const cur = logList.children[logActive];
    if(cur && cur.scrollIntoView) cur.scrollIntoView({ block:'nearest', inline:'nearest' });

    logDetail.innerHTML = '<p class="log-state">读取中…</p>';
    try{
      const entry = await loadLogEntry(list[logActive]);
      logDetail.innerHTML = renderLogEntry(entry);
      logDetail.scrollTop = 0;
    }catch(err){
      logDetail.innerHTML =
        `<p class="log-state">这条日志读不出来：${esc(err.message)}<br>` +
        `看看 ${esc(LOG_DIR + (list[logActive].file || 'index.json'))} 还在不在。</p>`;
    }
  }

  async function openLog(){
    logLastFocus = document.activeElement;
    logWin.classList.add('show');
    lockScroll(true);
    logClose.focus();
    if(logEntries) return;                       /* 已经读过了，直接看 */

    logDetail.innerHTML = '<p class="log-state">读取中…</p>';
    try{
      const list = await loadLogIndex();
      logCount.textContent = list.length ? list.length + ' 条' : '';
      if(!list.length){
        logList.innerHTML = '';
        logDetail.innerHTML =
          `<p class="log-state">还没有日志。<br>把条目写进 <code>${esc(LOG_DIR)}index.json</code>，这里就会列出来。</p>`;
        return;
      }
      logList.innerHTML = list.map((e, i) => `
        <button class="log-item" type="button" role="tab" aria-controls="logDetail"
                aria-selected="${i === 0 ? 'true' : 'false'}">
          <span class="d">${esc(e.date || '')}</span>
          <span>${esc(e.title || '（无标题）')}</span>
        </button>`).join('');
      Array.prototype.forEach.call(logList.children, (el, i) => {
        el.addEventListener('click', () => selectLog(i));
      });
      selectLog(0);
    }catch(err){
      logList.innerHTML = '';
      logCount.textContent = '';
      logDetail.innerHTML =
        `<p class="log-state">没读到 <code>${esc(LOG_INDEX)}</code>：${esc(err.message)}<br>` +
        `（用 file:// 直接打开页面时读不到，跑 部署.cmd serve 或看线上）</p>`;
    }
  }

  function closeLog(){
    if(!logWin.classList.contains('show')) return;
    logWin.classList.remove('show');
    lockScroll(false);
    if(logLastFocus && document.contains(logLastFocus)) logLastFocus.focus();
  }

  if(logBtn)   logBtn.addEventListener('click', openLog);
  if(logClose) logClose.addEventListener('click', closeLog);
  if(logWin)   logWin.addEventListener('click', e => { if(e.target === logWin) closeLog(); });
  if(logList)  logList.addEventListener('keydown', e => {
    const dir = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    if(!dir) return;
    e.preventDefault();
    selectLog(logActive + dir);
    const el = logList.children[logActive];
    if(el && el.focus) el.focus();
  });

  /* ============ 时光机（全部历史作业） ============
     数据在 GitHub 仓库的 class/data/ 里（部署后才有）。三级降级，哪一级挂掉都往下走：

       ① 目录：GitHub Contents API（3 秒超时；未认证只有 60 次/小时）
              → jsDelivr 上的 index-produce.json（**构建时生成**：目录 + 最近 5 天正文）
              → jsDelivr 上的 index.json（只有目录）
              → 同源 ./data/index-produce.json → ./data/hwk/index.json（本地 / 热铁盒）
       ② 每一份作业：raw.githubusercontent.com（3 秒超时）→ jsDelivr → 同源
       ③ 全挂 → 窗口里说一句「时光机暂时迷路了」，今天这份作业完全不受影响

     为什么要有 index-produce.json：GitHub API 一限流 / 一超时，能兜底的只有静态文件。
     目录**必须**落成文件（CDN 与静态托管都没法列目录），而 produce 把「最近 5 天的正文」
     一起带上 —— 兜底那一档因此只要一个请求，常看的那几天就全在了。
     它由构建按 class/data/hwk/*.json 生成，永远和数据一致
     （本地：控制台「写入作业」/「重建清单」；仓库：GitHub Actions 推完自动重建）。

     缓存：localStorage['hwk-index-v3']，5 分钟 TTL —— 这 5 分钟里反复开关不再打 API。
     按需读：列表一次显示 5 天，「加载更多」每次再要 5 天（顺手把那 5 天的正文取回来）；
            选中还没取过的那天会立刻补一次。内容片（科目条目 / 笔记）同样按需。 */
  const TM = {
    owner:'JinSuperOfficial',
    repo:'jinsuperofficial.github.io',
    branch:'main',
    path:'class/data/hwk',
    producePath:'class/data/index-produce.json',
    timeout:3000,
    ttl:5 * 60 * 1000,
    cacheKey:'hwk-index-v3',
    concurrency:8,
    page:5,                       /* 一次显示 / 一次加载 5 天 */
    local:'./data/hwk/',
    localProduce:'./data/index-produce.json'
  };
  const TM_API = `https://api.github.com/repos/${TM.owner}/${TM.repo}/contents/${TM.path}`;
  const TM_CDN = `https://cdn.jsdelivr.net/gh/${TM.owner}/${TM.repo}@${TM.branch}/${TM.path}/`;
  const TM_CDN_PRODUCE = `https://cdn.jsdelivr.net/gh/${TM.owner}/${TM.repo}@${TM.branch}/${TM.producePath}`;

  const tmWin    = document.getElementById('tmWin');
  const tmList   = document.getElementById('tmList');
  const tmDetail = document.getElementById('tmDetail');
  const tmCount  = document.getElementById('tmCount');
  const tmMore   = document.getElementById('tmMore');
  const tmBtn    = document.getElementById('tmBtn');
  const tmClose  = document.getElementById('tmClose');

  let tmAll       = null;   /* 全部历史（新的在前） */
  let tmShown     = 0;      /* 列表已经画了几条 */
  let tmActive    = -1;     /* 现在看的是第几条 */
  let tmLastFocus = null;
  let tmCacheHit  = false;
  let tmSeq       = 0;      /* 切日期的令牌：慢请求回来时如果已经不是它了，就别盖上去 */
  const tmRecords = {};     /* 正文缓存：文件名 → 记录（produce 里带来的会预先塞进来） */
  const tmPieces  = {};     /* 内容片缓存：基准 + id → 内容 */

  function tmSupported(){
    return typeof window.fetch === 'function' && typeof window.Promise === 'function';
  }

  /* 带超时的 fetch：3 秒没回就 abort。老内核不认 AbortController 就退化成普通 fetch */
  function tmFetch(url, options){
    const opt = options || {};
    if(typeof window.AbortController !== 'function') return fetch(url, opt);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), TM.timeout);
    return fetch(url, Object.assign({}, opt, { signal: ctl.signal })).then(
      res => { clearTimeout(timer); return res; },
      err => { clearTimeout(timer); throw err; }
    );
  }

  async function tmJson(url, options){
    const res = await tmFetch(url, options);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return parseLooseJson(await res.text());
  }

  function tmSort(list){
    return list.slice().sort((a, b) =>
      String(b.date || b.id).localeCompare(String(a.date || a.id)) || String(b.id).localeCompare(String(a.id)));
  }

  /* 从某个基准读 index.json：裸数组、{entries:[]} 都认 */
  async function tmIndexFrom(base, label){
    try{
      const json = await tmJson(base + 'index.json');
      const files = tmNormalizeList(json, base);
      if(!files) throw new Error('index.json 不是列表');
      console.log(`[时光机] 目录来自${label}：${files.length} 条`);
      return files;
    }catch(err){
      console.warn(`[时光机] ${label}的目录没读通：${err.message}`);
      return null;
    }
  }

  /* 目录（裸数组 / {entries:[]}）→ 排好序的文件列表 */
  function tmNormalizeList(json, base){
    const list = Array.isArray(json) ? json
               : (json && Array.isArray(json.entries) ? json.entries : null);
    if(!list) return null;
    const files = list
      .map(e => (typeof e === 'string' ? { name:e } : e))
      .filter(e => e && isHwkName(e.name))
      .map(e => ({
        id: String(e.id || e.name.replace(/^hwk-/, '').replace(/\.json$/, '')),
        name: e.name,
        date: String(e.date || ''),
        title: String(e.title || ''),
        base: base
      }));
    return files.length ? tmSort(files) : null;
  }

  /* 生产清单（构建时生成）：目录 + 最近 5 天的正文一起带回来。
     清单放在 class/data/ 下，正文在它的子目录里（清单里的 source 写着是哪个），
     所以文件基准要按 source 的最后一段拼 —— 不然会朝「清单旁边的 hwk-xxx.json」
     白打一次 404。认不出 source就干脆不定基准，走默认的 CDN → 同源那条链。
     整份认不出来（老版本 / 手写坏了）就返回 null，自然降级到 index.json */
  async function tmProduceFrom(url, label){
    try{
      const json = await tmJson(url);
      const files = tmNormalizeList(json, null);
      if(!json || !files) throw new Error('不是一份清单');
      let seeded = 0;
      const preview = (json.preview && typeof json.preview === 'object') ? json.preview : {};
      Object.keys(preview).forEach(name => {
        const rec = preview[name];
        if(!isHwkName(name) || !rec || typeof rec !== 'object') return;
        tmRecords[name] = Object.assign({}, rec, { __base:'', __name:name });
        seeded++;
      });
      const dir = url.replace(/[^/]*$/, '');
      const tail = String(json.source || '').split('/').filter(Boolean).pop() || '';
      const base = tail ? dir + tail + '/' : '';
      if(base) files.forEach(f => { f.base = base; f.download_url = base + f.name; });
      console.log(`[时光机] 目录来自${label}（生产清单）：${files.length} 条，自带正文 ${seeded} 天`
        + (base ? '，正文基准 ' + base : ''));
      return tmSort(files);
    }catch(err){
      console.warn(`[时光机] ${label}的生产清单没读通：${err.message}`);
      return null;
    }
  }

  async function tmListFiles(){
    /* 0. 缓存：5 分钟内不再打 API（目录 + 已经取回来的正文一起存） */
    try{
      const raw = localStorage.getItem(TM.cacheKey);
      const cached = raw ? JSON.parse(raw) : null;
      if(cached && cached.ts && (Date.now() - cached.ts) < TM.ttl &&
         Array.isArray(cached.data) && cached.data.length){
        tmCacheHit = true;
        const recs = cached.records && typeof cached.records === 'object' ? cached.records : {};
        Object.keys(recs).forEach(name => {
          const rec = recs[name];
          if(rec && typeof rec === 'object') tmRecords[name] = Object.assign({}, rec, { __base:'', __name:name });
        });
        return cached.data;
      }
    }catch(e){}

    let data = null;
    /* 1. GitHub Contents API（超时 3 秒）—— 主力：永远是最新的一份目录 */
    try{
      const items = await tmJson(TM_API, { headers:{ 'Accept':'application/vnd.github+json' } });
      if(!Array.isArray(items)) throw new Error('返回的不是目录列表');
      data = items
        .filter(it => it && it.type === 'file' && isHwkName(it.name))
        .map(it => {
          const base = String(it.download_url || '').replace(/[^/]*$/, '');
          return {
            id: it.name.replace(/^hwk-/, '').replace(/\.json$/, ''),
            name: it.name,
            date: '',                                 /* 目录接口不给正文，日期要等文件拉回来 */
            title: '',
            download_url: it.download_url,
            base: base || null
          };
        });
      if(!data.length) data = null;
    }catch(err){
      console.warn('[时光机] GitHub API 没读通（超时 / 限流 / 网络），改用 CDN 清单：' + err.message);
    }
    /* 2. CDN 上的**生产清单**（构建时生成：目录 + 最近几天正文，一个请求就够） */
    if(!data) data = await tmProduceFrom(TM_CDN_PRODUCE, 'CDN');
    /* 3. CDN 上的 index.json（只有目录） */
    if(!data) data = await tmIndexFrom(TM_CDN, 'CDN');
    /* 4. 同源：先生产清单，再 index.json（本地开发 / 热铁盒） */
    if(!data) data = await tmProduceFrom(TM.localProduce, '同源');
    if(!data) data = await tmIndexFrom(TM.local, '同源 data/hwk/');
    if(!data) throw new Error('几个来源的目录都没读到');

    data = tmSort(data.map(it => Object.assign({}, it, {
      download_url: it.download_url || (it.base || TM_CDN) + it.name
    })));
    tmCacheSave();
    return data;
  }

  /* 存缓存：目录 + 已经取到的正文（别存没读通的那份，免得下次开窗空着） */
  function tmCacheSave(){
    try{
      if(!tmAll || !tmAll.length) return;
      const records = {};
      Object.keys(tmRecords).forEach(name => {
        if(name.indexOf('__') !== 0) records[name] = tmRecords[name];
      });
      localStorage.setItem(TM.cacheKey, JSON.stringify({ ts:Date.now(), data:tmAll, records:records }));
    }catch(e){ /* 存不下（配额）就算了，下次再拉 */ }
  }

  /* 单份作业：raw → CDN → 同源（同一个地址只打一次）。全挂返回 null，不拖累别的 */
  async function tmFetchOne(f){
    if(tmRecords[f.name]) return tmRecords[f.name];
    const tries = [];
    const push = (url, base) => {
      if(url && !tries.some(t => t.url === url)) tries.push({ url:url, base:base });
    };
    if(f.download_url) push(f.download_url, f.base || String(f.download_url).replace(/[^/]*$/, ''));
    push(TM_CDN + f.name, TM_CDN);
    push(TM.local + f.name, TM.local);
    for(const t of tries){
      try{
        const one = await tmJson(t.url);
        if(one && typeof one === 'object'){
          const rec = Object.assign({}, one, { __base:t.base, __name:f.name });
          tmRecords[f.name] = rec;
          if(!f.date && rec.date) f.date = String(rec.date);
          if(!f.title && rec.title) f.title = String(rec.title);
          return rec;
        }
      }catch(err){ /* 往下一档 */ }
    }
    console.warn('[时光机] 这一份几个来源都没读到：' + f.name);
    return null;
  }

  /* 把「列表前 n 天」的正文补齐（并发 8 个一批）：已缓存的不再请求 */
  async function tmEnsure(n){
    const files = (tmAll || []).slice(0, Math.max(0, n));
    let changed = false;
    for(let i = 0; i < files.length; i += TM.concurrency){
      const batch = files.slice(i, i + TM.concurrency);
      await Promise.all(batch.map(async f => {
        const before = f.date + '|' + f.title;
        await tmFetchOne(f);
        if(before !== f.date + '|' + f.title) changed = true;
      }));
    }
    return changed;
  }

  /* 内容片：选中哪天拉哪天 */
  async function tmPiece(base, id){
    if(!id) return null;
    const key = (base || '') + id;
    if(key in tmPieces) return tmPieces[key];
    const urls = [];
    [base ? base + id + '.json' : null, TM_CDN + id + '.json', TM.local + id + '.json'].forEach(u => {
      if(u && urls.indexOf(u) < 0) urls.push(u);
    });
    let out = null;
    for(const u of urls){
      try{
        const one = await tmJson(u);
        if(one && typeof one === 'object'){ out = one; break; }
      }catch(e){ /* 往下一档 */ }
    }
    tmPieces[key] = out;
    return out;
  }

  /* 和主页同一套配色：固定 5 科查表，其他科目按它在这次作业里的顺序取拓展色 */
  function tmColors(names){
    const map = {};
    let extra = 0;
    names.forEach(name => {
      const base = BASE_SUBJECTS.find(s => s.name === name);
      if(base){ map[name] = base.color; return; }
      map[name] = EXTRA_COLORS[extra % EXTRA_COLORS.length];
      extra++;
    });
    return map;
  }

  /* 一天的样子：标题 + 日期编号背景，然后一科一科列（和表格一个观感，只是不能勾） */
  function tmRenderDay(rec, pieces){
    const out = [];
    out.push(`<h3 class="log-h">${esc(rec.title || ('作业 ' + (rec.date || rec.id)))}</h3>`);

    const meta = [];
    if(rec.date) meta.push(`<span>${esc(rec.date)}</span>`);
    if(rec.id)   meta.push(`<span class="log-tag">${esc(rec.id)}</span>`);
    const bgRaw = bgValue(rec.bg);
    if(bgRaw) meta.push(`<span class="log-tag">背景：${esc(BG_LABEL[normalizeBg(bgRaw)] || String(bgRaw))}</span>`);
    out.push(`<div class="log-meta">${meta.join('')}</div>`);

    /* 科目：老的 subjects+内容片写法，或者直接把正文写在记录里的新写法（默认） */
    const subjectMap = (rec.subjects && typeof rec.subjects === 'object') ? rec.subjects : null;
    const names = subjectMap
      ? Object.keys(subjectMap)
      : Object.keys(rec).filter(k => INLINE_RESERVED.indexOf(k) < 0 && k !== '笔记' &&
                                    k.slice(0, 2) !== '__' && typeof rec[k] === 'string');
    const colors = tmColors(names);

    if(!names.length){
      out.push('<p class="tm-none">这份作业里没写科目。</p>');
    }else{
      out.push('<ul class="tm-subj">');
      names.forEach(name => {
        const text = subjectMap
          ? ((pieces && pieces[subjectMap[name]] && typeof pieces[subjectMap[name]].text === 'string') ? pieces[subjectMap[name]].text : '')
          : String(rec[name] || '');
        const list = toList(text);
        out.push(`<li class="tm-subj-row">
          <span class="tm-subj-name" style="--c:${colors[name]}">${subjectIcon(name)}${esc(name)}</span>`);
        out.push(list.length
          ? `<ul class="tm-items">${list.map(it => `<li>${parseInlineMD(it)}</li>`).join('')}</ul>`
          : '<p class="tm-none">这天这一科没写</p>');
        out.push('</li>');
      });
      out.push('</ul>');
    }

    /* 笔记：老的 notesId 内容片，或者记录里的 "笔记" */
    const note = rec.notesId
      ? (pieces ? pieces[rec.notesId] : null)
      : (typeof rec['笔记'] === 'string' ? { text: rec['笔记'] } : null);
    if(note && typeof note.text === 'string' && note.text.trim() !== ''){
      out.push(`<div class="log-note tm-note"><span class="tm-note-label">Notes</span>${parseBlockMD(note.text)}</div>`);
    }
    return out.join('');
  }

  async function tmPiecesFor(rec){
    if(!rec.subjects) return null;              /* 内联写法（默认）：正文就在记录里，不用再拉文件 */
    const subjects = (rec.subjects && typeof rec.subjects === 'object') ? rec.subjects : {};
    const ids = [];
    Object.keys(subjects).forEach(k => { if(typeof subjects[k] === 'string') ids.push(subjects[k]); });
    if(typeof rec.notesId === 'string') ids.push(rec.notesId);
    const uniq = ids.filter((v, i) => v && ids.indexOf(v) === i);
    const pieces = {};
    await Promise.all(uniq.map(async id => { pieces[id] = await tmPiece(rec.__base, id); }));
    return pieces;
  }

  async function tmSelect(i){
    const list = tmAll || [];
    if(!list.length) return;
    tmActive = Math.max(0, Math.min(i, list.length - 1));

    Array.prototype.forEach.call(tmList.children, (el, k) => {
      el.setAttribute('aria-selected', k === tmActive ? 'true' : 'false');
    });
    const cur = tmList.children[tmActive];
    if(cur && cur.scrollIntoView) cur.scrollIntoView({ block:'nearest', inline:'nearest' });

    const token = ++tmSeq;
    const target = list[tmActive];
    if(!tmRecords[target.name]) tmDetail.innerHTML = '<p class="log-state">正在翻这一天的记录…</p>';
    try{
      const rec = await tmFetchOne(target);          /* produce 带来的那天直接用缓存，不再请求 */
      if(token !== tmSeq) return;                    /* 用户已经翻到别的日期了 */
      if(!rec){ tmDetail.innerHTML = '<p class="log-state">这一天的记录几个来源都没读到。</p>'; return; }
      const pieces = await tmPiecesFor(rec);
      if(token !== tmSeq) return;
      tmDetail.innerHTML = tmRenderDay(rec, pieces);
      tmDetail.scrollTop = 0;
    }catch(err){
      if(token !== tmSeq) return;
      tmDetail.innerHTML = `<p class="log-state">这一天的记录没读出来：${esc(err.message)}</p>`;
    }
  }

  function tmRenderList(){
    const list = tmAll || [];
    tmShown = Math.min(Math.max(tmShown, TM.page), list.length);
    tmList.innerHTML = list.slice(0, tmShown).map((h, i) => `
      <button class="log-item" type="button" role="tab" aria-controls="tmDetail"
              aria-selected="${i === tmActive ? 'true' : 'false'}">
        <span class="d">${esc(h.date || '')}</span>
        <span>${esc(h.title || h.id)}</span>
      </button>`).join('');
    Array.prototype.forEach.call(tmList.children, (el, i) => {
      el.addEventListener('click', () => tmSelect(i));
    });
    const left = list.length - tmShown;
    if(tmMore){
      tmMore.hidden = left <= 0;
      tmMore.textContent = left > 0 ? `加载更多（还有 ${left} 条）` : '';
    }
  }

  /* 「加载更多」：每次只再要 TM.page 天，并顺手把这 5 天的正文取回来 */
  async function tmMoreDays(){
    const list = tmAll || [];
    if(tmShown >= list.length) return;
    const before = tmShown;
    tmShown = Math.min(tmShown + TM.page, list.length);
    if(tmMore) tmMore.disabled = true;
    try{
      await tmEnsure(tmShown);
    }finally{
      if(tmMore) tmMore.disabled = false;
    }
    tmRenderList();
    tmCacheSave();
    /* 新露出来的第一天先选中，省得人还要自己点一下 */
    if(before === tmShown) return;
    const first = tmList.children[tmActive];
    if(first && first.scrollIntoView) first.scrollIntoView({ block:'nearest' });
  }

  async function openTimeline(){
    tmLastFocus = document.activeElement;
    tmWin.classList.add('show');
    lockScroll(true);
    tmClose.focus();
    if(tmAll && tmAll.length){                        /* 已经读过了，直接看 */
      tmCount.textContent = tmAll.length + ' 条 · 已缓存';
      tmRenderList();
      return;
    }
    tmList.innerHTML = '';
    tmCount.textContent = '';
    tmDetail.innerHTML = '<p class="log-state">正在穿越，整理过去的记录…</p>';

    try{
      tmAll = await tmListFiles();
      if(!tmAll.length){
        tmDetail.innerHTML = '<p class="log-state">时光机里空荡荡的，去丢点文件吧。</p>';
        return;
      }
      tmShown  = 0;
      tmActive = 0;
      tmRenderList();                                   /* 先画出来：点开就该有东西，别让人干等 */
      tmCount.textContent = tmAll.length + ' 条' + (tmCacheHit ? ' · 来自本地缓存' : '');
      /* 再把要显示的那 5 天正文补齐（GitHub API 那条路只给文件名，
         取回来才有日期和标题；produce 那条路本来就自带，等于没开销），补到就重画一次 */
      await tmEnsure(TM.page);
      tmRenderList();
      tmSelect(0);
      tmCacheSave();
    }catch(err){
      /* 几个来源都挂了：这是「预料之内的降级」，不是崩溃 —— warn 一声就够，
         窗口里已经明说「迷路了」，主页面（今天这份作业）照常。 */
      console.warn('[时光机] 几个来源都没读到：' + err.message);
      tmList.innerHTML = '';
      tmCount.textContent = '';
      tmDetail.innerHTML = '<p class="log-state">时光机暂时迷路了，稍后再试。</p>';
    }
  }

  function closeTimeline(){
    if(!tmWin.classList.contains('show')) return;
    tmWin.classList.remove('show');
    lockScroll(false);
    if(tmLastFocus && document.contains(tmLastFocus) && tmLastFocus.focus) tmLastFocus.focus();
    else if(tmBtn) tmBtn.focus();                     /* 触发元素没了 / 不是焦点元素，就把焦点还给按钮 */
  }

  if(tmBtn)   tmBtn.addEventListener('click', openTimeline);
  if(tmClose) tmClose.addEventListener('click', closeTimeline);
  if(tmWin)   tmWin.addEventListener('click', e => { if(e.target === tmWin) closeTimeline(); });
  if(tmMore)  tmMore.addEventListener('click', () => { tmMoreDays(); });
  if(tmList)  tmList.addEventListener('keydown', e => {
    const dir = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    if(!dir) return;
    e.preventDefault();
    tmSelect(tmActive + dir);
    const el = tmList.children[tmActive];
    if(el && el.focus) el.focus();
  });
  /* 焦点别跑出浮层：Tab 在弹窗里循环 */
  if(tmWin) tmWin.addEventListener('keydown', e => {
    if(e.key !== 'Tab') return;
    const items = tmWin.querySelectorAll('button:not([disabled]):not([hidden]), [href], [tabindex]:not([tabindex="-1"])');
    if(!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    /* ★ 手机底部动作面板也是「浮层」：它开着的时候 Esc 先收它，
       别顺手把背后的更新日志 / 时光机一起关掉。 */
    if(actsApi && actsApi.isOpen()){ actsApi.close(); return; }
    closeLog();
    closeTimeline();
    closeCongrats();
  });

  /* ============ 系统配色切换监听 ============ */
  function onSchemeChange(){
    lastStep = -1;
    const items = tbody.querySelectorAll('.hw-item');
    if(items.length){
      applyTint(tbody.querySelectorAll('.hw-item.done').length, items.length);
    }else{
      applyTint(0, 1);
    }
  }
  if(darkQuery.addEventListener){
    darkQuery.addEventListener('change', onSchemeChange);
  }else if(darkQuery.addListener){
    darkQuery.addListener(onSchemeChange);
  }

  /* ============================================================
     留言板（class/data/msg-api.php · class/data/roster.json）
     ------------------------------------------------------------
     三种活法，靠「能不能拿到一段合法 JSON」自动选，页面不弹错：

       ① 云端（热铁盒）      POST .php → {ok:true,...}，留言进 KV 数据库
       ② 本机（GitHub Pages / 桌面 / 安卓离线副本 / 断网）
                            .php 被当源码返回或直接 404 → 解析失败 → 存
                            localStorage['hw.msg.local.<日期>']
       ③ 只读缓存            上面两种情况都会把「上次拉到的云端留言」留在
                            localStorage['hw.msg.cache.<日期>']，本机模式里一起显示

     口径：
       · 留言按**这一天作业的日期**分（currentDate），换一天就换一块，不会串
       · 名字只能从 class/data/roster.json 里选（服务端也按它校验），记住上次选的人

       · 字符上限 120（页面上），PHP 那边收 160
       · 全程 textContent，不拼 innerHTML —— 留言是别人写的东西
     ============================================================ */
  const MsgBoard = (function(){

    const TIPS = {
      idle:  '选一下你是哪位同学，给这一天留句话（120 字以内）。',

    function readLS(key){

    /* ── 名单 ── */
    async function fetchRoster(){
      for(let i = 0; i < ROSTER_PATHS.length; i++){
        const url = ROSTER_PATHS[i];
        try{
          const res = await fetch(url, { cache:'no-store' });
          if(!res || !res.ok) continue;
          const txt = String(await res.text()).replace(/,\s*([}\]])/g, '$1');
          const json = JSON.parse(txt);
          const names = Array.isArray(json) ? json
                      : (json && Array.isArray(json.names) ? json.names : null);
          if(names && names.length){
            return names.filter(function(n){ return typeof n === 'string' && n.trim(); });
          }
        }catch(e){ /* 下一个来源 */ }

    }

    function fillNames(){

    /* ── 云端调用：6 秒超时，失败换下一个地址 ── */
    function apiPost(url, body){
      return new Promise(function(resolve, reject){
        let settled = false;
        let ctl = null;
        try{ if(typeof AbortController === 'function') ctl = new AbortController(); }catch(e){}
        const timer = setTimeout(function(){
          if(settled) return;
          settled = true;
          try{ if(ctl) ctl.abort(); }catch(e){}
          reject(new Error('超时'));
        }, 6000);
        const opt = {
          method: 'POST',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        };
        if(ctl) opt.signal = ctl.signal;
        fetch(url, opt).then(function(res){
          if(settled || !res) return null;
          return res.text().then(function(txt){ return { res: res, txt: txt }; });
        }).then(function(hit){
          if(settled || !hit) return;
          settled = true;
          clearTimeout(timer);
          if(!hit.res.ok){ reject(new Error('HTTP ' + hit.res.status)); return; }
          resolve(hit.txt);
        }).catch(function(err){
          if(settled) return;
          settled = true;
          clearTimeout(timer);
          reject(err);
        });
      });
    }

    async function callCloud(body, fresh){
      const urls = (api && !fresh) ? [api] : API_PATHS;
      let lastErr = null;
      for(let i = 0; i < urls.length; i++){
        const url = urls[i];
        try{
          const txt = await apiPost(url, body);
          /* GitHub Pages 会把 .php 源码当 text/plain 返回：不是 JSON 就换下一个 */
          if(typeof txt !== 'string' || txt.indexOf('{') === -1) throw new Error('不是 JSON');
          const json = JSON.parse(txt);
          if(!json || typeof json !== 'object') throw new Error('JSON 形状不对');
          api = url;
          return json;
        }catch(err){
          if(api === url) api = null;    /* 上次通的这次不通：下次重新探 */
          lastErr = err;
        }
      }
      throw lastErr || new Error('云端不可用');
    }

    /* ── 画 ── */
    function setMode(next){
      mode = next;
      if(stateEl){
        stateEl.dataset.mode = next;
        stateEl.textContent = LABEL[next] || LABEL.idle;
      }
      if(hintEl) hintEl.textContent = TIPS[next] || TIPS.idle;
    }

    function fmtTime(iso){
      const d = new Date(iso);
      if(isNaN(d.getTime())) return '';
      const two = function(n){ return (n < 10 ? '0' : '') + n; };
      const hm = two(d.getHours()) + ':' + two(d.getMinutes());
      const now = new Date();
      if(d.toDateString() === now.toDateString()) return hm;
      return two(d.getMonth() + 1) + '-' + two(d.getDate()) + ' ' + hm;
    }

    function renderItems(){
      if(!listEl) return;
      listEl.textContent = '';
      const adminOn = !!nameSel && nameSel.value === ADMIN;

      items.forEach(function(m){
        const li = document.createElement('li');
        li.className = 'msg-item';

        const av = document.createElement('span');
        av.className = 'msg-av';
        av.setAttribute('aria-hidden', 'true');
        av.textContent = String(m.n || '?').slice(0, 1);

        const body = document.createElement('div');
        body.className = 'msg-body';

        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        const nm = document.createElement('span');
        nm.className = 'msg-nm';
        nm.textContent = m.n || '（没名字）';
        const tm = document.createElement('span');
        tm.className = 'msg-tm';
        tm.textContent = fmtTime(m.at);
        meta.appendChild(nm);
        meta.appendChild(tm);

        const tx = document.createElement('p');
        tx.className = 'msg-tx';
        tx.textContent = m.t || '';

        body.appendChild(meta);
        body.appendChild(tx);
        li.appendChild(av);
        li.appendChild(body);

        if(adminOn){
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'msg-del';
          del.textContent = '删除';
          del.setAttribute('aria-label', '删除 ' + (m.n || '') + ' 的这条留言');
          del.addEventListener('click', function(){ removeOne(m); });
          li.appendChild(del);
        }

        listEl.appendChild(li);
      });

      if(emptyEl) emptyEl.hidden = items.length > 0;
      renderFoot();
    }

    function renderFoot(){
      if(!footEl) return;
      if(!items.length){ footEl.textContent = ''; return; }
      footEl.textContent = items.length + ' 条' + (mode === 'local' ? ' · 只在本机' : '');
    }

    function syncSend(){
      const n = nameSel ? nameSel.value : '';
      const t = textEl ? textEl.value.trim() : '';
      if(countEl && textEl) countEl.textContent = textEl.value.length + ' / ' + MAX_TEXT;
      if(tokenEl) tokenEl.hidden = (n !== ADMIN);
      if(sendBtn) sendBtn.disabled = busy || !n || !t || !roster.length;
    }

    /* ── 本机存 / 读 ── */
    function localList(){
      const arr = readJSON(LOCAL_DIR + date, []);
      return Array.isArray(arr) ? arr.filter(function(m){ return m && typeof m === 'object'; }) : [];
    }
    function cachedList(){
      const arr = readJSON(CACHE_DIR + date, []);
      return Array.isArray(arr) ? arr.filter(function(m){ return m && typeof m === 'object'; }) : [];
    }
    function saveLocal(item){
      const list = localList();
      list.unshift(item);
      writeJSON(LOCAL_DIR + date, list.slice(0, 200));
    }

    /* ── 拉列表 ── */
    async function refresh(fresh){
      if(!date) return;
      setMode('idle');
      if(!roster.length) roster = await fetchRoster();
      fillNames();
      if(!roster.length){
        setMode('error');
        if(hintEl) hintEl.textContent = '名单（data/roster.json）没读到，留言板先放着，作业照常看。';
        if(sendBtn) sendBtn.disabled = true;
        return;
      }
      try{
        const json = await callCloud({ action: 'list', date: date }, fresh);
        if(!json.ok) throw new Error(json.error || '拿不到列表');
        items = Array.isArray(json.items) ? json.items : [];
        writeJSON(CACHE_DIR + date, items);
        setMode('cloud');
      }catch(err){
        items = localList().concat(cachedList());
        setMode('local');
      }
      renderItems();
      syncSend();
    }

    /* ── 发一条 ── */
    async function submit(ev){
      if(ev) ev.preventDefault();
      if(busy) return;
      const n = nameSel ? nameSel.value : '';
      const t = textEl ? textEl.value.trim() : '';
      if(!n || !t) return;

      busy = true;
      syncSend();
      const at = new Date().toISOString();
      let saved = false;

      if(mode === 'cloud'){
        try{
          const json = await callCloud({ action: 'post', date: date, name: n, text: t });
          if(!json.ok){
            /* 服务端有话说（冷却 / 上限 / 名单）：照原话提示，不吞掉 */
            toast(json.error || '没发出去');
            busy = false;
            syncSend();
            return;
          }
          items = Array.isArray(json.items) ? json.items : items;
          writeJSON(CACHE_DIR + date, items);
          setMode('cloud');
          saved = true;
        }catch(err){
          /* 正在发的时候网断了：这条不能丢，落本机并说清楚 */
          saveLocal({ n: n, t: t, at: at });
          items = localList().concat(cachedList());
          setMode('local');
          saved = true;
          toast('云端没回话，这条先存在本机');
        }
      }else{
        saveLocal({ n: n, t: t, at: at });
        items = localList().concat(cachedList());
        saved = true;
      }

      busy = false;
      if(saved){
        if(textEl){
          textEl.value = '';
          try{ textEl.focus({ preventScroll: true }); }catch(e){ textEl.focus(); }
        }
        renderItems();
        syncSend();
        toast(mode === 'cloud' ? '留言发出去了' : '已存到本机');
      }else{
        syncSend();
      }
    }

    /* ── 删一条：金旭 + 口令 ── */
    async function removeOne(m){
      if(!nameSel || nameSel.value !== ADMIN){ toast('只有 ' + ADMIN + ' 能删留言'); return; }
      const token = tokenEl ? tokenEl.value.trim() : '';
      if(!token){
        toast('先填管理口令');
        if(tokenEl) try{ tokenEl.focus(); }catch(e){}
        return;
      }
      if(!window.confirm('删掉「' + (m.n || '') + '」这条留言？')) return;

      if(mode !== 'cloud'){
        const list = localList().filter(function(x){
          return !(x && x.at === m.at && x.n === m.n && x.t === m.t);
        });
        writeJSON(LOCAL_DIR + date, list);
        items = list.concat(cachedList());
        renderItems();
        toast('本机这条删掉了');
        return;
      }

      try{
        const json = await callCloud({ action: 'del', date: date, name: ADMIN, token: token, id: m.id });
        if(!json.ok){ toast(json.error || '没删掉'); return; }
        items = Array.isArray(json.items) ? json.items : items;
        writeJSON(CACHE_DIR + date, items);
        renderItems();
        toast('删掉了');
      }catch(err){
        toast('删不掉：' + (err.message || '连不上'));
      }
    }

    /* ── 对外：渲染完一份作业后叫一次 ── */
    function sync(nextId, nextDate){
      const stamp = String(nextId || nextDate || '');
      if(!stamp || stamp === mountedFor) return;
      mountedFor = stamp;
      const d = String(nextDate || '');
      date = /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : todayStr();
      items = [];
      renderItems();
      refresh(false).catch(function(){ setMode('error'); });
    }

    /* ── 接线 ── */
    if(form) form.addEventListener('submit', submit);
    if(textEl) textEl.addEventListener('input', syncSend);
    if(nameSel){
      nameSel.addEventListener('change', function(){
        lsSet(NAME_KEY, nameSel.value);
        syncSend();
        renderItems();          /* 选中「金旭」→ 每条冒出一个「删除」 */
      });
    }
    if(reloadBtn){
      reloadBtn.addEventListener('click', function(){
        refresh(true).catch(function(){ setMode('error'); });
      });
    }
    if(msgBtn && card){
      msgBtn.addEventListener('click', function(){
        const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        try{ card.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); }
        catch(e){ card.scrollIntoView(); }
        if(textEl){
          setTimeout(function(){
            try{ textEl.focus({ preventScroll: true }); }catch(e){ try{ textEl.focus(); }catch(e2){} }
          }, reduce ? 0 : 340);
        }
      });
    }

    return { sync: sync, refresh: function(){ return refresh(true); } };
  })();

  /* ============ 启动 ============ */
  /* 时光机：不支持 fetch / Promise 的浏览器直接把按钮藏掉（主页功能一点不受影响） */
  if(tmBtn && !tmSupported()) tmBtn.hidden = true;

  /* ---------- ★ 手机底部动作面板 ----------
     桌面（≥768px）上这一段等于不存在：CSS 里 .acts-toggle 是 display:none，
     .head-acts 就是原来那条横向按钮栏 —— 视觉与交互与改造前完全一致。

     手机上「更多811工具 / 背景 / 时光机 / 更新日志」四个按钮不搬家、不复制：
     它们仍是 .head-acts 的孩子，只是整条被定位到底部当动作面板。
     这里只做三件事：
       ① 往面板里插一枚开关（插在第一个，所以桌面 Tab 顺序仍是「开关 → 四个按钮」）；
       ② 管开 / 关、遮罩点击、焦点归位；
       ③ 视口变宽（转到桌面）时把状态收拾干净。
     —— 这也是为什么 Tab 顺序天然正确：DOM 顺序就是视觉顺序，没有用 CSS order 去改。 */
  const actsApi = (function initMobileActs(){
    const acts = document.getElementById('headActs');
    if(!acts || !document.querySelectorAll) return null;

    const CHEV_UP   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
    const CHEV_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'actsToggle';
    btn.className = 'acts-toggle';
    btn.setAttribute('aria-controls', 'headActs');
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-label', '打开页面动作');
    btn.innerHTML = CHEV_UP;
    /* ★ 插到面板**前面**（兄弟节点），不是插进面板里。
       面板在手机上带 `transform` 滑出屏幕，会把 position:fixed 的后代钉在它自己的
       坐标系里 —— 开关留在面板里就永远没有可见面积（详见 CSS 里那段长注释）。
       放在兄弟位仍然紧挨着面板，Tab 顺序也是「开关 → 面板里那几项」。 */
    acts.parentNode.insertBefore(btn, acts);

    let open = false;

    function sync(){
      acts.classList.toggle('on', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? '收起页面动作' : '打开页面动作');
      /* 图形也换一下：打开时朝下（=「收起来」），收起时朝上（=「拉出来」） */
      btn.innerHTML = open ? CHEV_DOWN : CHEV_UP;
    }
    function openPanel(){
      if(open) return;
      open = true; sync();
      /* 焦点送进面板第一站（就是这枚开关）：开着的时候键盘 / 屏读都留在浮层里 */
      btn.focus({ preventScroll: true });
    }
    function close(refocus){
      if(!open) return;
      open = false; sync();
      const a = document.activeElement;
      if(refocus && (a === btn || acts.contains(a))) btn.focus({ preventScroll: true });
    }

    btn.addEventListener('click', function(){ open ? close(true) : openPanel(); });

    /* 遮罩（面板背后那层整屏 ::after）与面板自身的空白处都算「点外面 → 收」。
       伪元素的命中目标就是宿主元素自己，所以判 t === acts 就够了。 */
    document.addEventListener('click', function(e){
      if(!open) return;
      if(e.target === acts) close(true);
    }, true);

    /* 点了面板里的某一项（换背景 / 时光机 / 更新日志 / 跳工具页）就顺手收起面板。
       ★ 但「外观 / 布局」这类开关例外（带 data-keep-open）：它们要连点着看效果，
         点一次就收起会变成"开两次关两次"，手机上特别别扭。 */
    acts.addEventListener('click', function(e){
      const hit = e.target && e.target.closest ? e.target.closest('.more-btn') : null;
      if(!hit || hit === btn) return;
      if(hit.hasAttribute('data-keep-open')) return;
      close(false);
    });

    /* 视口回到桌面：状态归零，免得下次缩回手机时面板是「开着」的 */
    function onVp(){
      if(window.innerWidth > 767) close(false);
    }
    window.addEventListener('resize', onVp);

    return { isOpen: function(){ return open; }, close: function(){ close(false); } };
  })();

  /* 便签标签上的那枚便签图标：SVG 路径只写在 JS 一处，这里插进去，别在 HTML 里抄第二份 */
  const noteLabelEl = document.getElementById('noteLabel');
  if(noteLabelEl) noteLabelEl.insertAdjacentHTML('afterbegin', subjectIcon('笔记'));

  applyBg();                                       /* 按记忆的档位先铺好底纹（含彩蛋层），别等数据 */
  syncSkinBtn();                                   /* 按钮文案对齐 <head> 里已经落好的皮肤 / 布局 */
  syncLayoutBtn();
  initReveal();                                    /* 首屏那几块（head / card / foot）先排队入场 */
  sbLayout();                                      /* 顶栏从哪冒出来：按头部的实际高度算 */
  railLayout();                                    /* 首帧先算一次滚动条（数据还没到，刻度是空的） */
  runFrame();                                      /* 把 thumb / 顶栏 / 视差对一次初始位置 */
  window.addEventListener('resize', (() => {       /* 视口变了重算「拼几张」 */
    let t = null;
    return () => { clearTimeout(t); t = setTimeout(paintPageBg, 180); };
  })());

  loadData().then(({ data, demo, egg }) => {
    isDemoMode = demo;
    render(data, egg);

    if(demo){
      noticeText.innerHTML =
        '没读到 <code>data/hwk/index.json</code>，下面是示例内容。' +
        '把当天记录放进 <code>data/hwk/</code>（拆分脚本 build/migrate-hwk.mjs）刷新即可。';
      notice.classList.add('show');
      revealNow(notice);                           /* 提示条是 display:none 起步的，直接放行更稳 */
    }
  }).catch(err => {
    isDemoMode = true;
    render(DEMO);
    noticeText.textContent = '读取作业数据出错，已显示示例内容：' + err.message;
    notice.classList.add('show');
    revealNow(notice);
  });

})();
</script>
