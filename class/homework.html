<!DOCTYPE html>
<html lang="zh-CN" data-no-theme-ctl>
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 主题：读 ?theme= 参数（安卓壳层按账号性别传进来），把 data-appearance /
     data-accent 写到 <html> 上。**必须放在样式之前** —— 晚了首屏会闪一下。
     data-no-theme-ctl 让 theme.js 不注入右上角那组切换按钮（作业页不需要）。 -->
<script src="../lib/theme.js"></script>
<title>八年(11)班作业</title>
<!-- ★ 入场动画的准备（head 里只干这一件事）：
     支持 IntersectionObserver、且用户没要求「减少动态效果」时，先把 <html> 标上 .reveal-on，
     首帧就是「待入场」状态 —— 不会先亮一遍再藏起来。
     没 JS / JS 报错 / reduced-motion 时这个 class 根本不存在，内容永远是可见的静态状态；
     页面底部启动逻辑里还有一道兜底：IO 没回调就把 .reveal-on 摘掉。 -->
<script>
(function(){
  try{
    if('IntersectionObserver' in window &&
       !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)){
      document.documentElement.classList.add('reveal-on');
    }
  }catch(e){}

  /* ---------- 外观皮肤 / 布局：同样要在首屏之前落到 <html> 上 ----------
     两个维度，和站点主题的 data-appearance / data-accent 并列、互不干扰：

       data-hw-skin    缺省 = 现在的纸感外观  |  deepseek = DeepSeek 蓝色极简
       data-hw-layout  缺省 = normal（单栏）  |  two = 一行两个科目

     来源优先级：**URL 参数（这次加载有效，不写盘）> localStorage（按钮点出来的偏好）**。
     URL 写法：?skin=deepseek|off、?layout=two|normal；另外认 ?theme=…deepseek…
     （作业专用域名的外壳页就是这么把皮肤传进来的；theme.js 认不出 deepseek 这个 token，
       会原样忽略，所以两边不打架）。

     为什么放在 <style> 之前：晚了首屏会先亮一下纸感外观再跳成蓝色，闪。 */
  try{
    var de = document.documentElement;
    var q = {};
    (location.search || '').replace(/^\?/, '').split('&').forEach(function(kv){
      if(!kv) return;
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      try{ q[decodeURIComponent(k)] = decodeURIComponent(v); }
      catch(e){ q[k] = v; }
    });
    var paramSkin   = String(q.skin || '').toLowerCase();
    var paramLayout = String(q.layout || '').toLowerCase();
    var themeTok    = String(q.theme || '').toLowerCase();

    var skin = '';
    if(paramSkin === 'deepseek' || /(^|[-_,+.\s])deepseek($|[-_,+.\s])/.test(themeTok)) skin = 'deepseek';
    else if(paramSkin === 'off' || paramSkin === '0' || paramSkin === 'none' || paramSkin === 'now') skin = '';
    else { try{ skin = localStorage.getItem('hw.skin') === 'deepseek' ? 'deepseek' : ''; }catch(e){} }

    var layout = '';
    if(paramLayout === 'two' || paramLayout === '2') layout = 'two';
    else if(paramLayout === 'normal' || paramLayout === 'one' || paramLayout === 'off') layout = '';
    else { try{ layout = localStorage.getItem('hw.layout') === 'two' ? 'two' : ''; }catch(e){} }

    if(skin) de.setAttribute('data-hw-skin', skin);
    if(layout) de.setAttribute('data-hw-layout', layout);
  }catch(e){}
})();
</script>
<style>
  :root{
    color-scheme: light dark;

    /* ---------- 浅色模式基准 ---------- */
    --bg:#F8F3EC;
    --paper:#FFFCF7;
    --ink:#2E2A26;
    --ink-soft:#6B635A;
    --oak:#8D6959;
    --olive:#8E9867;
    --clay:#D97757;
    --line:rgba(46,42,38,.12);
    --line-soft:rgba(46,42,38,.07);
    --check-mark:#FFFCF7;
    --done-text:#A9A29A;
    --empty-text:#B3ACA4;
    --foot-text:#A9A29A;
    --thead-bg:rgba(142,152,103,.07);
    --skeleton-1:rgba(46,42,38,.06);
    --skeleton-2:rgba(46,42,38,.11);
    --overlay:rgba(46,42,38,.34);
    --mark-bg:rgba(217,119,87,.13);
    --mark-border:rgba(217,119,87,.30);
    --cta-bg:#B0552F;
    --cta-bg-hover:#98462A;
    --shadow-1:rgba(46,42,38,.04);
    --shadow-2:rgba(46,42,38,.45);
    --shadow-3:rgba(46,42,38,.55);

    /* 动态色调（JS 按完成度重写）0% 冷灰蓝 → 100% 陶土橙 */
    --tint-accent: hsl(220 8% 60%);
    --tint-text:   hsl(220 8% 34%);
    --tint-soft:   hsl(220 8% 60% / .14);
    --tint-line:   hsl(220 8% 60% / .30);
    --tint-box:    hsl(220 8% 60% / .55);
    --tint-card:   hsl(220 8% 60% / .22);
    --tint-fill:   hsl(220 8% 60%);

    /* 背景光晕 */
    --glow-1: hsl(220 8% 60% / .16);
    --glow-2: hsl(220 8% 60% / .14);

    /* ---------- 圆角（macOS 风格：小半径 + 层级化 + 同心嵌套） ----------
       规范：.Skills/theme-plus/references/circle_angle.md
       默认 rounded-md / rounded-lg，窗口最多 rounded-xl，禁止 rounded-2xl / rounded-3xl
       以及按钮/输入框/卡片的 rounded-full；只有头像、开关、状态点才用胶囊。 */
    --radius-xs:4px;      /* 标签、徽章（≤6px） */
    --radius-sm:6px;      /* 小控件、行内代码块 */
    --radius-md:8px;      /* 按钮、输入框 */
    --radius-lg:10px;     /* 卡片、便签、浮层 */
    --radius-xl:12px;     /* 窗口、弹窗 */
    --radius-pill:999px;  /* 仅圆点、开关、状态标记 */

    --radius-control:var(--radius-md);
    --radius-button:var(--radius-md);
    --radius-card:var(--radius-lg);
    --radius-modal:var(--radius-xl);
    --radius-badge:var(--radius-sm);
    --radius-dot:var(--radius-pill);

    /* ---------- 动效令牌（时长 / 缓动，见 interaction.md §8） ---------- */
    --ease-out:cubic-bezier(.2,.7,.2,1);   /* 进入动画用 ease-out，不用 ease-in */
    --dur-fast:150ms;                      /* 微反馈 */
    --dur-base:300ms;                      /* 屏上移动 / 浮层 */
    --dur-enter:560ms;                     /* 入场（硬上限 700ms） */

    /* ---------- 滚动条 / 科目刻度（任务一） ----------
       --subject-color = 「当前正在读的科目」的颜色，由 JS 跟着滚动改（一个变量串起
       滚动条 thumb 和轨道刻度）；这里给的是还没读到科目时的兜底色。
       ★ 所有科目色只在 JS 的 BASE_SUBJECTS / EXTRA_COLORS 里定义，CSS 里不写死任何科目色。 */
    --subject-color:var(--olive);
    --rail-w:12px;          /* 悬浮轨道占的宽（不参与布局，挤不到内容） */
    --rail-thumb:7px;       /* thumb 视觉宽 ≤8px */
    --rail-thumb-hover:10px;/* hover / 触屏时展开到 10px */
    --rail-gap:2px;         /* 轨道离屏幕右边留一点 */
    --hw-gutter-comp:0px;   /* JS 量出来的「藏掉原生滚动条让出的宽」，等宽补偿给 body */

    --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }

  /* ---------- 深色模式（跟随系统） ---------- */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14120E;
      --paper:#1E1B17;
      --ink:#EDE7DF;
      --ink-soft:#A29A8E;
      --oak:#B89B85;
      --olive:#A8B57C;
      --clay:#E88B6D;
      --line:rgba(237,231,223,.14);
      --line-soft:rgba(237,231,223,.08);
      --check-mark:#1A1815;
      --done-text:#6B635A;
      --empty-text:#6B635A;
      --foot-text:#7A736A;
      --thead-bg:rgba(142,152,103,.12);
      --skeleton-1:rgba(237,231,223,.06);
      --skeleton-2:rgba(237,231,223,.12);
      --overlay:rgba(0,0,0,.60);
      --mark-bg:rgba(217,119,87,.20);
      --mark-border:rgba(217,119,87,.45);
      --cta-bg:#C9683D;
      --cta-bg-hover:#B0552F;
      --shadow-1:rgba(0,0,0,.40);
      --shadow-2:rgba(0,0,0,.70);
      --shadow-3:rgba(0,0,0,.80);

      --glow-1: hsl(220 12% 60% / .30);
      --glow-2: hsl(220 12% 60% / .26);
    }
  }

  *{box-sizing:border-box;margin:0;padding:0}

  /* ---------- 页面背景：四张底纹随机拼一条（见 JS 的 paintPageBg） ----------
     底色挪到 html 上、body 只留两团光晕 —— 这样 .bg 层（z-index:-1）
     才露得出来（body 上再压一层不透明底色的话它会整个被盖住）。 */
  html{ background-color:var(--bg); }

  body{
    min-height:100vh;
    background-image:
      radial-gradient(880px 520px at 12% -8%, var(--glow-1), transparent 62%),
      radial-gradient(760px 480px at 92% 4%, var(--glow-2), transparent 60%);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding:clamp(28px,6vw,76px) clamp(16px,5vw,40px) clamp(48px,8vw,100px);
    transition:background-color .5s ease, color .3s ease;
  }

  /* 底纹层：四张 1:1 的图，单张按 tile 宽铺；屏幕比一张宽就接下一张，
     每张都向下平铺（repeat-y）。位置/尺寸由 JS 按视口宽度算。
     图片本身已经很淡，再压一层纸张薄纱 —— 只当纹理看，不抢正文。 */
  .bg{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-repeat:repeat-y;
    background-position:0 0;
    background-size:var(--bg-tile,720px) auto;
  }
  .bg::after{
    content:''; position:absolute; inset:0;
    background:color-mix(in srgb, var(--bg) var(--bg-veil,62%), transparent);
  }
  @media (prefers-color-scheme: dark){
    /* 深色下底图还是浅色纸，必须压得更狠，不然浅底 + 浅字没法看 */
    .bg::after{ --bg-veil:90%; }
  }

  /* 游戏壁纸（整张 cover 铺满）：比四张底纹花得多，纱要厚一点 ——
     直接压在页面底色上的小字（meta / foot）才稳过 4.5:1。
     （class 由 JS 按当前档位加减，见「页面背景」一节。） */
  .bg.is-cover::after{ --bg-veil:70%; }
  @media (prefers-color-scheme: dark){
    .bg.is-cover::after{ --bg-veil:92%; }
  }

  .page{max-width:820px;margin:0 auto}

  /* ---------- 头部 ---------- */
  .head{margin-bottom:clamp(22px,3.6vw,36px)}
  .head-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }

  /* 头部右上角：切换背景 + 更多工具，两个按钮同排，窄屏自动换行 */
  .head-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--oak);
    margin-bottom:0;
  }
  .kicker::before{
    content:"";
    width:26px;height:1px;
    background:var(--tint-accent);
    flex:none;
    transition:background .5s ease;
  }

  /* ---------- 更多 811 工具（跳 /class/index.html） ---------- */
  .more-btn{
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    min-height:34px;
    padding:0 14px;
    border:1px solid var(--tint-line);
    border-radius:var(--radius-control);
    background:var(--tint-soft);
    color:var(--tint-text);
    font-family:inherit;
    font-size:13px;
    letter-spacing:.03em;
    text-decoration:none;
    white-space:nowrap;
    transition:
      background .22s ease,
      border-color .22s ease,
      color .22s ease,
      transform .15s ease;
  }
  .more-btn svg{width:15px;height:15px;flex:none}
  .more-btn:hover{
    background:var(--tint-card);
    border-color:var(--tint-accent);
    color:var(--ink);
    transform:translateY(-1px);
  }
  .more-btn:active{transform:translateY(0) scale(.985)}
  .more-btn:focus-visible{outline:2px solid var(--tint-accent);outline-offset:3px}

  h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(27px,5.4vw,42px);
    line-height:1.26;
    letter-spacing:-.01em;
  }

  /* ---------- 子标题（来自 JSON 的 title） ---------- */
  .subtitle{
    margin-top:12px;
    padding-left:13px;
    border-left:2px solid var(--tint-accent);
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(14px,2.2vw,17px);
    line-height:1.65;
    letter-spacing:.03em;
    color:var(--ink-soft);
    white-space:pre-line;
    word-break:break-word;
    transition:border-color .5s ease, color .3s ease;
  }
  .subtitle[hidden]{display:none}

  .meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:16px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .meta .sep{width:1px;height:12px;background:var(--line)}

  /* ---------- 进度条 ---------- */
  .progress-track{
    margin-top:16px;
    height:5px;
    border-radius:var(--radius-xs);
    background:rgba(46,42,38,.08);
    overflow:hidden;
  }
  @media (prefers-color-scheme: dark){
    .progress-track{ background:rgba(237,231,223,.10); }
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:var(--radius-xs);
    background:var(--tint-fill);
    transition:
      width .5s cubic-bezier(.2,.7,.2,1),
      background .5s ease;
  }

  /* ---------- 进度徽章 ---------- */
  .badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:4px 12px;
    border-radius:var(--radius-badge);
    background:var(--tint-soft);
    border:1px solid var(--tint-line);
    color:var(--tint-text);
    font-size:12.5px;
    letter-spacing:.02em;
    transition:
      background .5s ease,
      border-color .5s ease,
      color .5s ease;
  }
  .badge.all-done{
    font-weight:500;
    letter-spacing:.05em;
  }

  /* 完成 ≥ 80% 且未全部完成 → 兴奋颤抖 */
  @keyframes excited-shake{
    0%, 60%, 100%{ transform:translate3d(0,0,0) rotate(0deg); }
    64%{ transform:translate3d(-2.4px,.8px,0) rotate(-1.2deg); }
    68%{ transform:translate3d(2.4px,-.8px,0) rotate(1.2deg); }
    72%{ transform:translate3d(-2px,.6px,0) rotate(-1deg); }
    76%{ transform:translate3d(1.8px,-.6px,0) rotate(.9deg); }
    80%{ transform:translate3d(-1.4px,.4px,0) rotate(-.7deg); }
    84%{ transform:translate3d(1.1px,-.4px,0) rotate(.55deg); }
    88%{ transform:translate3d(-.7px,.2px,0) rotate(-.35deg); }
    92%{ transform:translate3d(.4px,-.15px,0) rotate(.2deg); }
  }
  .badge.excited{
    animation:excited-shake 3.2s cubic-bezier(.4,0,.2,1) infinite;
    will-change:transform;
  }
  @media (prefers-reduced-motion: reduce){
    .badge.excited{ animation:none; }
    .progress-fill{ transition:none; }
  }

  /* ---------- 提示条 ---------- */
  .notice{
    display:none;
    align-items:flex-start;
    gap:11px;
    padding:14px 18px;
    margin-bottom:18px;
    border-radius:var(--radius-card);
    background:rgba(192,138,62,.11);
    border:1px solid rgba(192,138,62,.28);
    color:#7A5619;
    font-size:13.5px;
    line-height:1.75;
  }
  @media (prefers-color-scheme: dark){
    .notice{
      background:rgba(192,138,62,.16);
      border-color:rgba(192,138,62,.36);
      color:#E0B57A;
    }
  }
  .notice.show{display:flex}
  .notice .ico{flex:none;font-size:15px;line-height:1.5}
  .notice code{
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:12.5px;
    background:rgba(122,86,25,.10);
    padding:1px 6px;
    border-radius:var(--radius-xs);
  }
  @media (prefers-color-scheme: dark){
    .notice code{ background:rgba(224,181,122,.14); }
  }

  /* ---------- 表格卡片 ---------- */
  .card{
    background:var(--paper);
    border:1px solid var(--tint-card);
    border-radius:var(--radius-card);
    overflow:hidden;
    box-shadow:
      0 1px 2px var(--shadow-1),
      0 26px 52px -34px var(--shadow-2);
    transition:border-color .5s ease, background .3s ease, box-shadow .3s ease;
  }

  table{width:100%;border-collapse:collapse}

  thead th{
    text-align:left;
    font-size:11.5px;
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--oak);
    padding:15px clamp(16px,2.6vw,26px);
    background:var(--thead-bg);
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    transition:background .3s ease, border-color .3s ease, color .3s ease;
  }
  thead th:first-child{width:132px}

  tbody td{
    padding:clamp(15px,2.2vw,20px) clamp(16px,2.6vw,26px);
    border-bottom:1px solid var(--line-soft);
    vertical-align:top;
    transition:border-color .3s ease;
  }
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .22s}
  tbody tr:hover{background:rgba(142,152,103,.045)}
  @media (prefers-color-scheme: dark){
    tbody tr:hover{background:rgba(142,152,103,.06)}
  }

  .subject{
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-family:var(--serif);
    font-size:15.5px;
    letter-spacing:.05em;
    white-space:nowrap;
  }
  /* ---------- 科目图标（已经取代原来的小光点） ----------
     统一规格：内联 SVG、viewBox 0 0 24 24、stroke=currentColor、stroke-width=1.5、fill=none，
     无背景块、无阴影、无渐变、不用 Emoji、不请求任何图标库。
     尺寸 18px：旧光点是 9px 点 + 3px 光晕（视觉 ≈15px），18px 落在规范给的 16–20px 里，
     行高一点没动（行高由右边那列作业列表撑着，图标比文字行矮）。
     颜色：父级 color:var(--c) —— 和行底色、滚动条刻度共用 JS 里那一份科目色，
     图标用 currentColor 自动跟随，改色只改一处。 */
  .subject .ico{
    width:18px;height:18px;
    flex:none;
    color:var(--c);
    overflow:visible;                       /* 24 的框别把 1.5 的描边切掉 */
    transition:color .3s ease;
  }
  @media (prefers-color-scheme: dark){
    .subject .ico{ filter:brightness(1.12) saturate(1.04); }   /* 深色下提一档，和原来那个点一致 */
  }
  /* 便签（NOTES）标签上的小图标：跟科目图标同一套路径，尺寸随标签的字号收一档 */
  .note-label .ico{
    width:13px;height:13px;
    color:inherit;
    vertical-align:-2px;
    margin-right:3px;
  }

  /* ---------- 科目色底（原来的科目背景图已删掉，只留这一层） ----------
     科目色一律从 JS 的 BASE_SUBJECTS / EXTRA_COLORS 来，这里只负责「混纸张」；
     自动拓展出来的科目（EXTRA_COLORS 那套）不用改 CSS。 */
  tbody tr{
    /* 半透明：行 hover 的高亮还能透出来（纸张色在 .card 上，底下是同一张纸） */
    --hw-tint: color-mix(in srgb, var(--c, var(--olive)) 13%, transparent);
  }
  tbody td:first-child{
    background-color: var(--hw-tint);
  }
  /* 不认 color-mix 的老内核（Safari 16.0/16.1 等）：--hw-tint 会在计算值阶段失效、
     底色整条丢掉 —— 用同一个 --c 加一层 13% 透明度的垫底，观感与上面一致。 */
  @supports not (color: color-mix(in srgb, red 10%, transparent)){
    tbody td:first-child{ position:relative; }
    tbody td:first-child::before{
      content:""; position:absolute; inset:0;
      background:var(--c, var(--olive));
      opacity:.13;
      pointer-events:none;
    }
  }

  .hw-list{list-style:none;display:grid;gap:11px}

  .hw-item{
    display:flex;
    align-items:flex-start;
    gap:11px;
    cursor:pointer;
    padding:2px 0;
    border-radius:var(--radius-sm);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .hw-item:focus-visible{
    outline:2px solid var(--tint-accent);
    outline-offset:3px;
  }

  .box{
    flex:none;
    width:17px;height:17px;
    margin-top:4px;
    border:1.5px solid var(--tint-box);
    border-radius:var(--radius-xs);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:
      background .2s,
      border-color .5s ease,
      transform .2s;
  }
  .box svg{
    width:10px;height:10px;
    opacity:0;
    transform:scale(.6);
    transition:opacity .18s, transform .18s;
  }
  .box svg path{ stroke:var(--check-mark); }
  .hw-item:hover .box{border-color:var(--tint-accent)}
  .hw-item.done .box{background:var(--olive);border-color:var(--olive)}
  .hw-item.done .box svg{opacity:1;transform:scale(1)}
  .hw-item:active .box{transform:scale(.9)}

  .text{
    font-size:15px;
    line-height:1.78;
    color:var(--ink);
    white-space:pre-line;
    transition:color .22s;
    word-break:break-word;
    min-width:0;
  }
  .hw-item.done .text{
    color:var(--done-text);
    text-decoration:line-through;
    text-decoration-thickness:1px;
    text-decoration-color:currentColor;
  }
  
  /* 新增：支持 Markdown 行内元素渲染 */
  .text strong { font-weight: 600; }
  .text code { 
    font-family: "SF Mono", Menlo, Consolas, monospace; 
    font-size: 0.9em; 
    background: rgba(142,152,103,.1); 
    padding: 2px 5px; 
    border-radius: var(--radius-xs); 
  }

  .empty{font-size:14.5px;color:var(--empty-text);letter-spacing:.04em}

  /* 骨架屏 */
  .skeleton{
    height:15px;
    border-radius:var(--radius-sm);
    background:linear-gradient(90deg, var(--skeleton-1), var(--skeleton-2), var(--skeleton-1));
    background-size:200% 100%;
    animation:shimmer 1.3s ease-in-out infinite;
  }
  .skeleton + .skeleton{margin-top:11px}
  @keyframes shimmer{
    0%{background-position:180% 0}
    100%{background-position:-80% 0}
  }

  /* ---------- 便签（Notes） ---------- */
  .note{
    position:relative;
    margin-top:18px;
    padding:14px 18px 15px 22px;
    background:#FDF7D9;
    border:1px solid rgba(190,155,65,.28);
    border-radius:var(--radius-card);
    box-shadow:
      0 1px 2px rgba(150,120,40,.06),
      0 8px 20px -14px rgba(150,120,40,.30);
    transition:background .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .note[hidden]{ display:none; }

  .note::before{
    content:"";
    position:absolute;
    left:0; top:12px; bottom:12px;
    width:3px;
    border-radius:0 var(--radius-xs) var(--radius-xs) 0;
    background:#E8C560;
    transition:background .3s ease;
  }

  .note-label{
    display:inline-block;
    font-size:10px;
    font-weight:500;
    letter-spacing:.20em;
    text-transform:uppercase;
    color:#9C7B2A;
    margin-bottom:5px;
  }

  .note-text{
    font-size:14.5px;
    line-height:1.75;
    color:#5C4A1C;
    white-space:pre-line;
    word-break:break-word;
  }

  /* 新增：笔记支持 Markdown 表格及列表样式 */
  .note-text p { margin-bottom: 6px; }
  .note-text p:last-child { margin-bottom: 0; }
  .note-text ul { padding-left: 20px; margin-bottom: 6px; }
  .note-text table { 
    border-collapse: collapse; 
    width: 100%; 
    margin: 10px 0; 
    font-size: 14px;
  }
  .note-text th, .note-text td { 
    border: 1px solid rgba(190,155,65,.28); 
    padding: 6px 12px; 
    text-align: left; 
    color: #5C4A1C;
  }
  .note-text th { background: rgba(232, 197, 96, 0.15); font-weight: 500; }

  @media (prefers-color-scheme: dark){
    .note{
      background:#2A2414;
      border-color:rgba(200,170,80,.22);
      box-shadow:
        0 1px 2px rgba(0,0,0,.30),
        0 8px 20px -14px rgba(0,0,0,.60);
    }
    .note::before{ background:#C9A84C; }
    .note-label{ color:#C9A84C; }
    .note-text{ color:#E8DBA8; }
    .note-text th, .note-text td { 
      border-color: rgba(200,170,80,.22); 
      color: #E8DBA8;
    }
    .note-text th { background: rgba(201, 168, 76, 0.1); }
    .note-text code { background: rgba(224,181,122,.14); }
  }

  .foot{
    margin-top:22px;
    text-align:center;
    font-size:12.5px;
    color:var(--foot-text);
    letter-spacing:.06em;
  }

  /* ---------- 恭喜弹窗 ---------- */
  .congrats{
    position:fixed;
    inset:0;
    z-index:60;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--overlay);
    -webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease, visibility 0s linear .22s, background .3s ease;
  }
  .congrats.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transition:opacity .22s ease, visibility 0s, background .3s ease;
  }

  .congrats-card{
    width:min(360px,100%);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-modal);
    padding:clamp(26px,5.4vw,34px);
    text-align:center;
    box-shadow:0 30px 64px -32px var(--shadow-3);
    transform:translateY(14px) scale(.97);
    transition:transform .3s cubic-bezier(.2,.7,.2,1), background .3s ease, border-color .3s ease;
  }
  .congrats.show .congrats-card{transform:none}

  .congrats-mark{
    width:54px;height:54px;
    margin:0 auto 16px;
    border-radius:var(--radius-dot);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--mark-bg);
    border:1px solid var(--mark-border);
    transition:background .3s ease, border-color .3s ease;
  }
  .congrats-mark svg{width:24px;height:24px}

  .congrats-title{
    font-family:var(--serif);
    font-weight:500;
    font-size:20px;
    line-height:1.4;
    letter-spacing:.02em;
    color:var(--ink);
  }

  .congrats-text{
    margin-top:9px;
    font-size:14px;
    line-height:1.8;
    color:var(--ink-soft);
    white-space:pre-line;
    word-break:break-word;
  }

  /* 彩蛋模式：弹窗整体冷下来，和喜庆版形成反差 */
  .congrats.easter .congrats-mark{
    background:rgba(120,120,120,.13);
    border-color:rgba(120,120,120,.30);
  }
  .congrats.easter .congrats-mark svg path{
    stroke:#8C8C8C;
  }
  .congrats.easter .congrats-title{
    color:var(--ink-soft);
    font-weight:400;
  }
  .congrats.easter .congrats-text{
    color:var(--ink-soft);
    font-style:italic;
  }
  .congrats.easter .congrats-btn{
    background:#5A5A5A;
  }
  .congrats.easter .congrats-btn:hover{
    background:#4A4A4A;
  }

  .congrats-btn{
    margin-top:22px;
    min-height:44px;
    padding:0 28px;
    border:0;
    border-radius:var(--radius-button);
    background:var(--cta-bg);
    color:#FFFCF7;
    font-family:inherit;
    font-size:14.5px;
    letter-spacing:.05em;
    cursor:pointer;
    transition:background .18s ease, transform .15s ease;
  }
  .congrats-btn:hover{background:var(--cta-bg-hover);transform:translateY(-1px)}
  .congrats-btn:active{transform:translateY(0) scale(.98)}
  .congrats-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  /* ---------- 更新日志（悬浮窗） ----------
     数据在 /class/data/hwk-log/（和 data/hwk/ 同级）：
       index.json = 目录，每条日志一个文件 —— 页面只读，从不写、也不改历史。
     样式和「恭喜弹窗」同一套：遮罩 + 纸卡片，这里左边多一列日期、右边是正文。 */
  .logwin{
    position:fixed;
    inset:0;
    z-index:70;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(12px,3.4vw,30px);
    background:var(--overlay);
    -webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease, visibility 0s linear .22s, background .3s ease;
  }
  .logwin.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transition:opacity .22s ease, visibility 0s, background .3s ease;
  }

  .logwin-card{
    width:min(720px,100%);
    max-height:min(80vh,700px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-modal);
    box-shadow:0 30px 64px -32px var(--shadow-3);
    transform:translateY(12px) scale(.98);
    transition:transform .3s cubic-bezier(.2,.7,.2,1), background .3s ease, border-color .3s ease;
  }
  .logwin.show .logwin-card{transform:none}

  .logwin-head{
    flex:none;
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 12px 13px 18px;
    background:var(--thead-bg);
    border-bottom:1px solid var(--line);
    transition:background .3s ease, border-color .3s ease;
  }
  .logwin-head .ico{width:16px;height:16px;flex:none;color:var(--oak)}
  .logwin-title{
    font-family:var(--serif);
    font-weight:500;
    font-size:15.5px;
    letter-spacing:.06em;
    color:var(--ink);
  }
  .logwin-count{font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
  .logwin-close{
    margin-left:auto;
    flex:none;
    width:30px;height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid transparent;
    border-radius:var(--radius-sm);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .logwin-close:hover{background:var(--tint-soft);border-color:var(--tint-line);color:var(--ink)}
  .logwin-close:active{transform:scale(.94)}
  .logwin-close:focus-visible{outline:2px solid var(--tint-accent);outline-offset:2px}
  .logwin-close svg{width:14px;height:14px}

  .logwin-body{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:186px minmax(0,1fr);
  }

  .logwin-list{
    min-height:0;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:3px;
    padding:10px;
    border-right:1px solid var(--line-soft);
  }
  .log-item{
    display:flex;
    flex-direction:column;
    gap:2px;
    width:100%;
    text-align:left;
    padding:8px 10px;
    border:1px solid transparent;
    border-radius:var(--radius-sm);
    background:transparent;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
    line-height:1.5;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .log-item .d{font-size:11px;letter-spacing:.06em;color:var(--oak)}
  .log-item:hover{background:var(--tint-soft);color:var(--ink)}
  .log-item[aria-selected="true"]{
    background:var(--tint-soft);
    border-color:var(--tint-line);
    color:var(--ink);
  }
  .log-item:focus-visible{outline:2px solid var(--tint-accent);outline-offset:1px}

  .logwin-detail{
    min-height:0;
    overflow:auto;
    padding:18px clamp(16px,2.6vw,24px) 24px;
    outline:none;
  }
  .logwin-detail:focus-visible{outline:2px solid var(--tint-accent);outline-offset:-2px}

  .log-h{
    font-family:var(--serif);
    font-weight:500;
    font-size:19px;
    line-height:1.45;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .log-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:9px;
    padding-bottom:13px;
    border-bottom:1px solid var(--line-soft);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .log-ver{
    padding:2px 8px;
    border-radius:var(--radius-badge);
    background:var(--mark-bg);
    border:1px solid var(--mark-border);
    color:var(--clay);
    font-size:11.5px;
    letter-spacing:.06em;
  }
  .log-tag{
    padding:2px 8px;
    border-radius:var(--radius-badge);
    background:var(--tint-soft);
    border:1px solid var(--tint-line);
    color:var(--tint-text);
    font-size:11.5px;
  }
  .log-sum{margin-top:11px;font-size:14px;line-height:1.8;color:var(--ink-soft)}
  .log-sec{margin-top:16px}
  .log-sec h4{
    margin-bottom:7px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--oak);
  }
  .log-sec ul{list-style:none;display:grid;gap:6px}
  .log-sec li{
    position:relative;
    padding-left:16px;
    font-size:14px;
    line-height:1.75;
    color:var(--ink);
    word-break:break-word;
  }
  .log-sec li::before{
    content:"";
    position:absolute;
    left:2px; top:.62em;
    width:5px;height:5px;
    border-radius:var(--radius-dot);
    background:var(--tint-accent);
  }
  .log-sec li code,.log-sum code,.log-note code,.tm-items li code{
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:.9em;
    background:rgba(142,152,103,.1);
    padding:1px 5px;
    border-radius:var(--radius-xs);
  }
  .log-note{
    margin-top:16px;
    padding:11px 14px;
    border-left:2px solid var(--tint-accent);
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    background:var(--tint-soft);
    font-size:13.5px;
    line-height:1.75;
    color:var(--ink-soft);
  }
  .log-state{
    padding:26px 4px;
    text-align:center;
    font-size:13.5px;
    line-height:1.8;
    color:var(--empty-text);
    letter-spacing:.04em;
  }

  @media (max-width:640px){
    .logwin-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .logwin-list{
      flex-direction:row;
      gap:6px;
      overflow-x:auto;
      overflow-y:hidden;
      padding:9px 10px;
      border-right:0;
      border-bottom:1px solid var(--line-soft);
    }
    .log-item{flex:none;width:auto;max-width:190px}
  }
  @media (prefers-reduced-motion: reduce){
    .logwin{transition-duration:1ms}
    .logwin-card{transition:none}
    .log-item,.logwin-close{transition:none}
  }

  /* ---------- 时光机（骨架复用更新日志那套悬浮窗，这里只补「按天看作业」那点样式） ---------- */
  .more-btn[hidden]{ display:none; }        /* 不支持 fetch / Promise 的浏览器把按钮藏掉 */

  .tm-more{
    flex:none;
    margin:0 10px 10px;
    min-height:36px;
    border:1px solid var(--tint-line);
    border-radius:var(--radius-control);
    background:var(--tint-soft);
    color:var(--tint-text);
    font-family:inherit;
    font-size:13px;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease, color .18s ease;
  }
  .tm-more:hover{ background:var(--tint-card); border-color:var(--tint-accent); color:var(--ink) }
  .tm-more:active{ transform:scale(.985) }
  .tm-more:focus-visible{ outline:2px solid var(--tint-accent); outline-offset:2px }
  .tm-more[hidden]{ display:none }

  .tm-subj{ list-style:none; display:grid; gap:16px }
  .tm-subj-row{ border-top:1px solid var(--line-soft); padding-top:12px }
  .tm-subj-row:first-child{ border-top:0; padding-top:0 }
  .tm-subj-name{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--serif);
    font-size:14.5px;
    letter-spacing:.05em;
    color:var(--ink);
  }
  .tm-subj-name .ico{ width:16px; height:16px; flex:none; color:var(--c) }
  .tm-items{ list-style:none; display:grid; gap:7px; margin-top:9px }
  .tm-items li{
    position:relative;
    padding-left:16px;
    font-size:14px;
    line-height:1.75;
    color:var(--ink);
    word-break:break-word;
  }
  .tm-items li::before{
    content:"";
    position:absolute;
    left:2px; top:.62em;
    width:5px; height:5px;
    border-radius:var(--radius-dot);
    background:var(--tint-accent);
  }
  .tm-none{ margin-top:6px; font-size:13.5px; color:var(--empty-text); letter-spacing:.04em }
  .tm-note-label{
    display:block;
    font-size:10px;
    font-weight:500;
    letter-spacing:.20em;
    text-transform:uppercase;
    color:var(--oak);
    margin-bottom:4px;
  }
  .tm-note p{ margin-bottom:6px }
  .tm-note p:last-child{ margin-bottom:0 }
  @media (prefers-reduced-motion: reduce){
    .tm-more{ transition:none }
  }

  /* ---------- 连续曲率：支持时启用 squircle，不支持就退回小半径 ---------- */
  @supports (corner-shape: squircle){
    .card,
    .note,
    .notice,
    .congrats-card,
    .congrats-btn,
    .more-btn,
    .badge,
    .box,
    .hw-item,
    .logwin-card,
    .log-item,
    .logwin-close,
    .skeleton{
      corner-shape:squircle;
    }
  }

  /* ---------- 彩蛋：全屏书堆底图 + 两侧竖排字 ----------
     默认 opacity:0 + visibility:hidden（不用 display:none —— 那样没法淡入），
     命中条件时 JS 给这个容器加上 .show-easter-egg → 1.5s 淡入。

     它是**底图层**（z-index:-1，在 .bg 之后所以盖住随机底纹、在正文之下）：
     书堆只占四边，正中留白让作业卡片照常浮在上面，字也贴着左右边缘，
     所以彩蛋出现时作业依然完全可读。
     字一律 HTML + CSS 叠上去，绝不让 AI 往图里画字（中文必糊）。 */
  .easter{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    opacity:0; visibility:hidden;
    transition:opacity 1.5s ease, visibility 0s linear 1.5s;
    background:
      url('../asset/homework/egg_background.jpg') center / cover no-repeat,
      var(--bg);
  }
  .easter.show-easter-egg{
    opacity:1; visibility:visible;
    transition:opacity 1.5s ease, visibility 0s;
  }
  /* 深色模式：底图还是浅色纸，压一层深色薄纱，免得浅字压浅底 */
  .easter::after{
    content:''; position:absolute; inset:0; z-index:0;
    background:color-mix(in srgb, var(--bg) var(--egg-veil,0%), transparent);
  }
  @media (prefers-color-scheme: dark){
    .easter::after{ --egg-veil:88%; }
  }

  /* 竖排字：贴着左右边缘、落在四周的书堆上，中间大片留白留给作业卡片 */
  .easter-text{
    position:absolute; z-index:1; top:50%; transform:translateY(-50%);
    margin:0;
    writing-mode:vertical-rl;
    font-family:var(--serif);
    font-size:clamp(16px,2.6vw,24px);
    letter-spacing:.34em;
    /* 浅色下就是规范里点名的 #8D6959 / #D97757；深色下自动换成亮一档的 */
    color:var(--oak);
    text-shadow:
      0 1px 6px color-mix(in srgb, var(--bg) 92%, transparent),
      0 0 16px color-mix(in srgb, var(--bg) 78%, transparent);
  }
  .easter-text.left{ left:clamp(14px,3.4vw,58px); }
  .easter-text.right{ right:clamp(14px,3.4vw,58px); color:var(--clay); }
  @media (prefers-color-scheme: dark){
    .easter-text.left{ color:#EBD8C4; }
    .easter-text.right{ color:#F0A98F; }
  }

  /* 屏太矮：字缩小，别顶出屏幕 */
  @media (max-height:520px){
    .easter-text{ font-size:13.5px; letter-spacing:.2em; }
  }

  @media (prefers-reduced-motion: reduce){
    .congrats{transition-duration:1ms}
    .congrats-card{transition-duration:1ms}
    .more-btn{transition:none}
    .more-btn:hover{transform:none}
    tbody tr{transition:none}
    .note{transition:none}
    .easter{transition-duration:1ms}
  }

  @media (max-width:600px){
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tbody tr{
      border-bottom:1px solid var(--line);
      padding:6px 0 12px;
    }
    tbody tr:last-child{border-bottom:none}
    tbody td{border:none;padding:6px clamp(16px,5vw,22px)}
    tbody td:first-child{padding-top:16px;padding-bottom:2px}
    tbody td:last-child{padding-bottom:16px}
    .subject{font-size:14.5px}
    /* 窄屏：科目格子从「竖条」变成「窄横幅」 */
    tbody tr[data-subject] td:first-child{
      min-height:86px;
      padding-top:15px;
      padding-bottom:12px;
    }
  }

  /* ============================================================
     任务一 · 滚动条：原生兜底 + 自绘轨道
     ============================================================ */

  /* ① 先把「轨道位置」常驻下来：内容短 / 长两种状态下内容都不左右跳
        （Chrome 94+ / Firefox 97+ / Safari 18.2+）。老 Safari 不认这条 ——
        好在 macOS / iOS 本来就是 overlay 滚动条、不占宽，也就不会跳。 */
  html{ scrollbar-gutter:stable; }

  /* ② 颜色分流：两条路分开写，别指望一套样式通吃（TIPS 里点名那个坑）。
        新内核（Firefox 全家 / Chrome 121+ / Safari 18.4+）一旦认 scrollbar-color，
        就**完全忽略** ::-webkit-scrollbar 的颜色 —— 所以这两块永远只可能命中一块。 */
  @supports (scrollbar-color: auto){
    html{
      scrollbar-width:thin;                              /* 视觉宽 ≈11px，比默认的细一点 */
      scrollbar-color:var(--subject-color) transparent;  /* thumb 随当前科目，轨道透明 */
    }
  }
  @supports not (scrollbar-color: auto){
    /* 旧 Chrome（<121）/ 旧 Safari：只认伪元素。轨道透明 + pill 圆角 + 半透明 thumb。 */
    html::-webkit-scrollbar{ width:8px; height:8px; background:transparent; }
    html::-webkit-scrollbar-track{ background:transparent; }
    html::-webkit-scrollbar-thumb{
      background:var(--subject-color);                                  /* 不认 color-mix 的老内核兜底 */
      background:color-mix(in srgb, var(--subject-color) 62%, transparent);
      border-radius:var(--radius-pill);
    }
    html::-webkit-scrollbar-thumb:hover{
      background:var(--subject-color);
      background:color-mix(in srgb, var(--subject-color) 82%, transparent);
    }
    html::-webkit-scrollbar-corner{ background:transparent; }
  }
  /* 两块都不认 → 落到系统默认滚动条：能滚、键盘能翻页、不报错，只是没换皮。
     ★ 颜色一律不挂 transition：多数内核不重绘滚动条，动画会卡住或闪一下。 */

  /* ③ 自绘轨道 ----------------------------------------------------
     为什么自绘：轨道上要放「每个科目一枚、可点、可 Tab」的刻度，原生滚动条做不到。
     占地：整条 12px，position:fixed 悬浮在屏幕最右边 —— 不参与布局、不挤内容宽度；
     藏掉原生滚动条让出的那点宽由 JS 量出来、等宽补在 body 的 padding-right 上，所以不跳。
     交互：只有 thumb 和刻度按钮吃指针事件，其余 pointer-events:none ——
     滚轮 / 方向键 / PageUp·PageDown / 惯性滚动 / 屏幕阅读器全都还是原生的，一点没碰。 */
  html.hw-rail-on{ scrollbar-width:none; }                    /* Firefox / Chrome 121+ */
  html.hw-rail-on::-webkit-scrollbar{ width:0; height:0; }    /* 旧 WebKit / Blink：收掉原生那条 */
  html.hw-rail-on body{
    /* 等宽补偿：内容盒和「有原生滚动条那会儿」一模一样，有没有滚动条都不跳 */
    padding-right:calc(clamp(16px,5vw,40px) + var(--hw-gutter-comp,0px));
  }

  .rail{
    position:fixed;
    top:0; bottom:0;                    /* 不用 100vh：iOS 地址栏收起/展开也不会错位 */
    right:var(--rail-gap);
    width:var(--rail-w);
    z-index:50;                         /* 正文之上、两个弹窗（60 / 70）之下 */
    pointer-events:none;                /* 整条穿透，只有 thumb / 刻度收事件 */
    opacity:0; visibility:hidden;
    transition:opacity var(--dur-fast) linear, visibility 0s linear var(--dur-fast);
  }
  .rail.on{
    opacity:1; visibility:visible;
    transition:opacity var(--dur-base) var(--ease-out), visibility 0s;
  }

  .rail-thumb{
    position:absolute;
    left:50%; top:0;
    width:var(--rail-thumb);            /* 视觉宽 ≤8px；hover / 触屏展开到 10px */
    height:44px;                        /* 首帧兜底，JS 按「可视比例」重算 */
    border-radius:var(--radius-pill);   /* 滚动条该有的形态，规范里唯一允许胶囊的地方之一 */
    pointer-events:auto;
    cursor:grab;
    touch-action:none;                  /* 拖 thumb 时别让页面跟着一起滚 */
    /* thumb：科目色 + 透明度（半透明），JS 把 --subject-color 跟着当前科目换 */
    background:var(--subject-color);                                       /* 老内核兜底：纯科目色 */
    background:color-mix(in oklab, var(--subject-color) 55%, transparent);
    /* 再压一道 1px 内描边：55% 半透明的科目色压在底色上只有 1.35–2.80:1（够不上非文本组件的 3:1），
       这道掺 ink 的边是最深的一层 —— 按 oklab 精确算过 5 个科目色 + 12 个拓展色：
       浅色下 4.12–10.55:1、深色下 5.38–12.02:1，边界对比稳过 3:1。 */
    box-shadow:inset 0 0 0 1px var(--subject-color);
    box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--subject-color) 55%, var(--ink));
    transform:translate3d(-50%,0,0);    /* 位置只用 transform（不动 top / height，免 layout） */
  }
  .rail:hover .rail-thumb,
  .rail:focus-within .rail-thumb{ width:var(--rail-thumb-hover); }
  .rail-thumb.is-dragging{ cursor:grabbing; }

  /* 刻度：一枚 = 一个科目，位置按该科目在列表里的相对位置算（JS 定，resize 重算） */
  .rail-mark{
    position:absolute;
    left:0; top:0;
    width:100%; height:14px;            /* 命中区；视觉只有中间那颗 5px 的点 */
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0; border:0; background:none;
    pointer-events:auto;
    cursor:pointer;
    color:var(--c);
    -webkit-tap-highlight-color:transparent;
  }
  .rail-mark > i{
    display:block;
    width:5px; height:5px;
    border-radius:var(--radius-pill);
    background:var(--c);                                            /* 老内核兜底 */
    background:color-mix(in oklab, var(--c) 55%, var(--ink));       /* 同 thumb 的算法，稳过 3:1 */
    opacity:.7;
    transition:transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) linear, box-shadow var(--dur-fast) linear;
  }
  .rail-mark:hover > i{ transform:scale(1.5); opacity:1; }
  /* 当前读到的科目：点变大 + 加一圈 —— 状态不只靠颜色传递 */
  .rail-mark[data-active="1"] > i{
    transform:scale(1.35); opacity:1;
    box-shadow:0 0 0 1.5px color-mix(in oklab, var(--c) 55%, var(--ink));
  }
  /* 键盘焦点：用 ink 描一圈（深浅两套配色下都够对比），字号不抢戏 */
  .rail-mark:focus-visible{ outline:none; }
  .rail-mark:focus-visible > i{
    transform:scale(1.5); opacity:1;
    box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--ink);
  }
  /* hover / focus 显示科目名（纯 CSS，跟着 data-name 走） */
  .rail-mark::after{
    content:attr(data-name);
    position:absolute;
    right:calc(100% + 6px); top:50%;
    transform:translate3d(6px,-50%,0);
    padding:3px 8px;
    border-radius:var(--radius-sm);               /* 小浮层：6px */
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--sans);
    font-size:12px;
    line-height:1.5;
    letter-spacing:.02em;
    white-space:nowrap;
    box-shadow:0 8px 20px -12px var(--shadow-2);
    opacity:0; visibility:hidden;
    pointer-events:none;
    transition:opacity var(--dur-fast) linear, transform var(--dur-fast) var(--ease-out), visibility 0s linear var(--dur-fast);
  }
  .rail-mark:hover::after,
  .rail-mark:focus-visible::after{
    opacity:1; visibility:visible; transform:translate3d(0,-50%,0);
    transition:opacity var(--dur-fast) linear, transform var(--dur-fast) var(--ease-out), visibility 0s;
  }
  @media (pointer:coarse){
    :root{ --rail-w:16px; --rail-thumb:8px; --rail-thumb-hover:10px; }
    .rail-mark{ height:18px; }
    .rail-mark > i{ width:6px; height:6px; }
  }
  @media (prefers-reduced-motion: reduce){
    .rail, .rail.on, .rail-thumb, .rail-mark > i, .rail-mark::after{ transition:none; }
  }

  /* ============================================================
     任务三 · 滚动效果（学 deepseek.com 的观感，不照抄实现）
     ============================================================
     ① 内容进入节奏 —— IntersectionObserver + CSS transition。
        没用 animation-timeline:view()：view() 的进度是「元素在视口里的相对位置」，
        首屏本来就在视口里的元素一上来就落在 range 中段，会出现半透明的一帧 ——
        正文对比度会短暂掉下去；IO 这条路首屏就是「立刻补一场 460ms 淡入」，可控。
     ② 背景随滚动轻微流动 —— animation-timeline:scroll(root block)（Chrome 115+，纯 CSS、零 JS）；
        Safari 16 这类不支持的，由 JS 用一次 translate3d 兜底，且只在桌面 + 允许动效时开。
     ③ 顶栏收缩 —— 滚过 <h1> 浮出一条状态条，再往上滚收一档；单元素 transition
        （工具页按 interaction.md §8 走「时长 + ease-out」，不用 spring）。
     门控：reduced-motion 全部退化为静态（内容可见，只是不动）；视差只在
     hover:hover + pointer:fine 的桌面开；不劫持滚轮；整页不设 scroll-behavior:smooth
     （那会跟键盘 / 屏读打架）；will-change 只在滚动前后临时挂，不常驻。
     ============================================================ */

  /* ---------- ① 内容进入 ---------- */
  html.reveal-on .rv{ opacity:0; transform:translate3d(0,14px,0); }
  html.reveal-on .rv.rv-in{
    opacity:1; transform:none;
    /* 末尾把 .card 自己的那几条 transition 接回来：这条规则比 `tbody tr` / `.card`
       的选择器更具体，不接回来的话卡片换色调时会失去原来的过渡。 */
    transition:
      opacity 460ms linear var(--rv-d,0ms),
      transform var(--dur-enter) var(--ease-out) var(--rv-d,0ms),
      border-color .5s ease, background .3s ease, box-shadow .3s ease;
  }
  /* 表格行只淡入、不位移：transform 落在 <tr> 上在个别内核里不生效（行错峰本来也只需要淡） */
  html.reveal-on .rv-tr{ opacity:0; }
  html.reveal-on .rv-tr.rv-in{
    opacity:1;
    transition:opacity 520ms linear var(--rv-d,0ms), background .22s ease;
  }
  @media (prefers-reduced-motion: reduce){
    html.reveal-on .rv,
    html.reveal-on .rv-tr{ opacity:1; transform:none; transition:none; }
  }

  /* ---------- ② 背景随滚动轻微流动（纯 CSS 那条） ---------- */
  @supports (animation-timeline: scroll()){
    @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference){
      .bg{
        animation:bg-drift linear both;
        animation-timeline:scroll(root block);   /* 跑在合成器上，滚动路上零 JS */
      }
    }
  }
  /* scale(1.06) 先把这层放大 6%：挡掉上下各 2.6% 平移露出来的边；
     幅度很小，就是「背景比内容慢半拍」的那种感觉，不动的话也完全能看。 */
  @keyframes bg-drift{
    from{ transform:translate3d(0,-2.6%,0) scale(1.06); }
    to  { transform:translate3d(0, 2.6%,0) scale(1.06); }
  }
  /* JS 兜底那条（Safari 16 / 旧内核）挂的就是这一档，保证两边观感一致 */
  .bg.is-drift{ transform:translate3d(0,0,0) scale(1.06); }

  /* ---------- ③ 顶栏收缩 ---------- */
  /* 纯状态层：position:fixed + pointer-events:none —— 不动任何布局高度、不抢焦点；
     里面的字对 aria-hidden（正文里已经有 h1 和 aria-live 的进度了，这是重复信息）。 */
  .sb{
    position:fixed;
    top:0; left:0; right:0;
    z-index:40;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px clamp(16px,5vw,40px);
    pointer-events:none;
    background:var(--bg);                                        /* 不认 color-mix 的内核兜底 */
    background:color-mix(in srgb, var(--bg) 84%, transparent);
    border-bottom:1px solid transparent;
    /* 毛玻璃：两条都写（不认识的那条会被忽略）—— Safari 16 只认 -webkit- 前缀那条，
       认不出的时候底色本来就不透明（见上面那行 color-mix 的兜底），不会开天窗。 */
    -webkit-backdrop-filter:blur(10px) saturate(120%);
    backdrop-filter:blur(10px) saturate(120%);
    opacity:0; visibility:hidden;
    transform:translate3d(0,-100%,0);
    transition:
      opacity var(--dur-base) var(--ease-out),
      transform var(--dur-base) var(--ease-out),
      padding var(--dur-base) var(--ease-out),
      border-color var(--dur-base) linear,
      box-shadow var(--dur-base) linear,
      visibility 0s linear var(--dur-base);
  }
  .sb.on{
    opacity:1; visibility:visible;
    transform:translate3d(0,0,0);
    border-bottom-color:var(--line-soft);
    box-shadow:0 12px 24px -22px var(--shadow-2);
    transition:
      opacity var(--dur-base) var(--ease-out),
      transform var(--dur-base) var(--ease-out),
      padding var(--dur-base) var(--ease-out),
      border-color var(--dur-base) linear,
      box-shadow var(--dur-base) linear,
      visibility 0s;
  }
  /* 第二档：再往上滚一截就「收」一下 —— 收 padding + 缩标题，不重排正文 */
  .sb.min{ padding-top:8px; padding-bottom:8px; }
  .sb-title{
    flex:none;
    font-family:var(--serif);
    font-size:14px;
    letter-spacing:.05em;
    color:var(--ink);
    transform-origin:left center;
    transition:transform var(--dur-base) var(--ease-out);
  }
  .sb.min .sb-title{ transform:scale(.92); }
  .sb-track{
    flex:1 1 auto;
    min-width:0;
    height:3px;
    /* 进度条不是「状态点」，按圆角规范用最小令牌（胶囊只留给 thumb / 刻度点 / 头像开关） */
    border-radius:var(--radius-xs);
    background:var(--line);
    overflow:hidden;
  }
  .sb-fill{
    display:block;
    height:100%; width:0%;
    border-radius:var(--radius-xs);
    background:var(--tint-fill);
    transition:width .5s cubic-bezier(.2,.7,.2,1), background .5s ease;
  }
  .sb-prog{
    flex:none;
    font-size:12.5px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  @media (max-width:600px){
    .sb-track{ display:none; }                       /* 窄屏别挤，留标题 + 数字就够 */
  }
  @media (prefers-reduced-motion: reduce){
    .sb, .sb.on, .sb-title, .sb-fill{ transition:none; }
  }

  /* ══════════════ 主题属性驱动（安卓壳层用 ?theme= 传进来） ══════════════
     lib/theme.js 会把 data-appearance / data-accent 写到 <html> 上。
     下面两块让「强制暗」「强制亮」都能盖过系统的 prefers-color-scheme。

     ★ 变量内容是从上面那两处（基础 :root 与暗色媒体查询）**原样复制**的 ——
       色值一个没改，所以「指定主题」和「跟随系统」看起来完全一致。
       改了上面那份记得回来同步这两块（或重跑生成脚本）。
     ★ 正文/次要文字的对比度沿用原值，未新增未验的颜色。 */
  :root[data-appearance="dark"]{
    color-scheme:dark;

      --bg:#14120E;
      --paper:#1E1B17;
      --ink:#EDE7DF;
      --ink-soft:#A29A8E;
      --oak:#B89B85;
      --olive:#A8B57C;
      --clay:#E88B6D;
      --line:rgba(237,231,223,.14);
      --line-soft:rgba(237,231,223,.08);
      --check-mark:#1A1815;
      --done-text:#6B635A;
      --empty-text:#6B635A;
      --foot-text:#7A736A;
      --thead-bg:rgba(142,152,103,.12);
      --skeleton-1:rgba(237,231,223,.06);
      --skeleton-2:rgba(237,231,223,.12);
      --overlay:rgba(0,0,0,.60);
      --mark-bg:rgba(217,119,87,.20);
      --mark-border:rgba(217,119,87,.45);
      --cta-bg:#C9683D;
      --cta-bg-hover:#B0552F;
      --shadow-1:rgba(0,0,0,.40);
      --shadow-2:rgba(0,0,0,.70);
      --shadow-3:rgba(0,0,0,.80);

      --glow-1: hsl(220 12% 60% / .30);
      --glow-2: hsl(220 12% 60% / .26);
  }
  @media (prefers-color-scheme: dark){
    /* 系统是暗的、但这台设备指定了亮色 —— 把浅色基准再压回来 */
    :root[data-appearance="light"]{
      color-scheme:light;


    /* ---------- 浅色模式基准 ---------- */
    --bg:#F8F3EC;
    --paper:#FFFCF7;
    --ink:#2E2A26;
    --ink-soft:#6B635A;
    --oak:#8D6959;
    --olive:#8E9867;
    --clay:#D97757;
    --line:rgba(46,42,38,.12);
    --line-soft:rgba(46,42,38,.07);
    --check-mark:#FFFCF7;
    --done-text:#A9A29A;
    --empty-text:#B3ACA4;
    --foot-text:#A9A29A;
    --thead-bg:rgba(142,152,103,.07);
    --skeleton-1:rgba(46,42,38,.06);
    --skeleton-2:rgba(46,42,38,.11);
    --overlay:rgba(46,42,38,.34);
    --mark-bg:rgba(217,119,87,.13);
    --mark-border:rgba(217,119,87,.30);
    --cta-bg:#B0552F;
    --cta-bg-hover:#98462A;
    --shadow-1:rgba(46,42,38,.04);
    --shadow-2:rgba(46,42,38,.45);
    --shadow-3:rgba(46,42,38,.55);

    /* 动态色调（JS 按完成度重写）0% 冷灰蓝 → 100% 陶土橙 */
    --tint-accent: hsl(220 8% 60%);
    --tint-text:   hsl(220 8% 34%);
    --tint-soft:   hsl(220 8% 60% / .14);
    --tint-line:   hsl(220 8% 60% / .30);
    --tint-box:    hsl(220 8% 60% / .55);
    --tint-card:   hsl(220 8% 60% / .22);
    --tint-fill:   hsl(220 8% 60%);

    /* 背景光晕 */
    --glow-1: hsl(220 8% 60% / .16);
    --glow-2: hsl(220 8% 60% / .14);

    /* ---------- 圆角（macOS 风格：小半径 + 层级化 + 同心嵌套） ----------
       规范：.Skills/theme-plus/references/circle_angle.md
       默认 rounded-md / rounded-lg，窗口最多 rounded-xl，禁止 rounded-2xl / rounded-3xl
       以及按钮/输入框/卡片的 rounded-full；只有头像、开关、状态点才用胶囊。 */
    --radius-xs:4px;      /* 标签、徽章（≤6px） */
    --radius-sm:6px;      /* 小控件、行内代码块 */
    --radius-md:8px;      /* 按钮、输入框 */
    --radius-lg:10px;     /* 卡片、便签、浮层 */
    --radius-xl:12px;     /* 窗口、弹窗 */
    --radius-pill:999px;  /* 仅圆点、开关、状态标记 */

    --radius-control:var(--radius-md);
    --radius-button:var(--radius-md);
    --radius-card:var(--radius-lg);
    --radius-modal:var(--radius-xl);
    --radius-badge:var(--radius-sm);
    --radius-dot:var(--radius-pill);

    /* ---------- 动效令牌（时长 / 缓动，见 interaction.md §8） ---------- */
    --ease-out:cubic-bezier(.2,.7,.2,1);   /* 进入动画用 ease-out，不用 ease-in */
    --dur-fast:150ms;                      /* 微反馈 */
    --dur-base:300ms;                      /* 屏上移动 / 浮层 */
    --dur-enter:560ms;                     /* 入场（硬上限 700ms） */

    /* ---------- 滚动条 / 科目刻度（任务一） ----------
       --subject-color = 「当前正在读的科目」的颜色，由 JS 跟着滚动改（一个变量串起
       滚动条 thumb 和轨道刻度）；这里给的是还没读到科目时的兜底色。
       ★ 所有科目色只在 JS 的 BASE_SUBJECTS / EXTRA_COLORS 里定义，CSS 里不写死任何科目色。 */
    --subject-color:var(--olive);
    --rail-w:12px;          /* 悬浮轨道占的宽（不参与布局，挤不到内容） */
    --rail-thumb:7px;       /* thumb 视觉宽 ≤8px */
    --rail-thumb-hover:10px;/* hover / 触屏时展开到 10px */
    --rail-gap:2px;         /* 轨道离屏幕右边留一点 */
    --hw-gutter-comp:0px;   /* JS 量出来的「藏掉原生滚动条让出的宽」，等宽补偿给 body */

    --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    }
  }

  /* 强调色：跟 class/index.html 用**同一组值**（浅 5.47:1 / 暗 8.04:1 都验过）。
     --cta-bg 是主按钮底色、--mark-bg/--mark-border 是选中标记，
     只换 --clay 会花，所以一起换。 */
  :root[data-accent="blue"]{
    --clay:#3964FE; --cta-bg:#3964FE; --cta-bg-hover:#2E52D8;
    --mark-bg:rgba(57,100,254,.16); --mark-border:rgba(57,100,254,.40);
  }
  :root[data-appearance="dark"][data-accent="blue"]{
    --clay:#5686FE; --cta-bg:#5686FE; --cta-bg-hover:#6E97FF;
    --mark-bg:rgba(86,134,254,.20); --mark-border:rgba(86,134,254,.45);
  }
  :root[data-accent="pink"]{
    --clay:#B0306A; --cta-bg:#B0306A; --cta-bg-hover:#9A2A5C;
    --mark-bg:rgba(176,48,106,.18); --mark-border:rgba(176,48,106,.42);
  }
  :root[data-appearance="dark"][data-accent="pink"]{
    --clay:#F08BB0; --cta-bg:#F08BB0; --cta-bg-hover:#E87AA2;
    --mark-bg:rgba(240,139,176,.20); --mark-border:rgba(240,139,176,.45);
  }

  /* ============================================================
     外观皮肤：DeepSeek 蓝色极简（<html data-hw-skin="deepseek">）
     ------------------------------------------------------------
     和上面那套「纸感 + 陶土橙」不是一路，所以**不是换一两个变量糊过去**，
     而是整份重写色 token（亮 / 暗各一套），再补几条组件规则：

       · 标题改用无衬线、字号明显放大 —— 就是需求里的「标题的大字显示」
       · 卡片去纸边、去大阴影，只留 1px 细线：平、净、留白多
       · 强调色统一 DeepSeek 蓝：文字级 #3D5AF1（白字压上去 5.27:1）、
         装饰级 #4D6BFE；勾选框 / 进度条 / 提示条都跟着走
       · 便签（.note）从明黄色改成"蓝纸"，否则整页会被一块黄拽走

     对比度（都在 4.5:1 以上，`build/test-homework.mjs` 里会算一遍钉住）：
       亮：ink 15.1:1 · ink-soft 6.0:1 · 白字/cta 5.27:1 · foot 4.86:1
       暗：ink 15.4:1 · ink-soft 7.2:1 · 白字/cta 5.27:1

     ★ 为什么只需要「亮」和「亮+强制暗」两块：
       theme.js 一定会把解析后的 data-appearance 写到 <html> 上，
       所以「系统暗」和「手动暗」最后都是 [data-appearance="dark"] 这一种状态，
       不需要再跟 @media (prefers-color-scheme) 的优先级打架。
     ★ 这一段只声明 token / 组件规则，**不放断点**；断点统一在下面「响应式」段。
     ============================================================ */
  :root[data-hw-skin="deepseek"]{
    color-scheme:light;

    --bg:#F4F7FE;
    --paper:#FFFFFF;
    --ink:#161B2E;
    --ink-soft:#5A6478;
    --oak:#475569;
    --olive:#4D6BFE;
    --clay:#3D5AF1;
    --line:rgba(22,27,46,.10);
    --line-soft:rgba(22,27,46,.06);
    --check-mark:#FFFFFF;
    --done-text:#6E7789;
    --empty-text:#6E7789;
    --foot-text:#646D80;
    --thead-bg:#F7F9FF;
    --skeleton-1:rgba(22,27,46,.06);
    --skeleton-2:rgba(22,27,46,.11);
    --overlay:rgba(15,23,42,.42);
    --mark-bg:rgba(77,107,254,.12);
    --mark-border:rgba(77,107,254,.38);
    --cta-bg:#3D5AF1;
    --cta-bg-hover:#2F49D6;
    --shadow-1:rgba(15,23,42,.04);
    --shadow-2:rgba(15,23,42,.10);
    --shadow-3:rgba(15,23,42,.16);

    /* 动态色调的起点（JS 按完成度重写，斜坡见下面「色调系统」的 RAMPS） */
    --tint-accent:hsl(226 88% 62%);
    --tint-text:hsl(226 62% 38%);
    --tint-soft:hsl(226 88% 62% / .12);
    --tint-line:hsl(226 88% 62% / .26);
    --tint-box:hsl(226 88% 62% / .55);
    --tint-card:hsl(226 88% 62% / .16);
    --tint-fill:hsl(226 88% 62%);

    --glow-1:hsl(226 100% 63% / .10);
    --glow-2:hsl(226 100% 63% / .08);

    --subject-color:#4D6BFE;
  }
  :root[data-hw-skin="deepseek"][data-appearance="dark"]{
    color-scheme:dark;

    --bg:#0B0E17;
    --paper:#121722;
    --ink:#E9ECF5;
    --ink-soft:#9AA3B8;
    --oak:#A8B4CC;
    --olive:#7C93FF;
    --clay:#8AA2FF;
    --line:rgba(233,236,245,.14);
    --line-soft:rgba(233,236,245,.08);
    --check-mark:#0B0E17;
    --done-text:#8A93A8;
    --empty-text:#8A93A8;
    --foot-text:#8A93A8;
    --thead-bg:#161C29;
    --skeleton-1:rgba(233,236,245,.06);
    --skeleton-2:rgba(233,236,245,.12);
    --overlay:rgba(0,0,0,.62);
    --mark-bg:rgba(122,147,255,.20);
    --mark-border:rgba(122,147,255,.46);
    --cta-bg:#3D5AF1;
    --cta-bg-hover:#4D6BFE;
    --shadow-1:rgba(0,0,0,.40);
    --shadow-2:rgba(0,0,0,.66);
    --shadow-3:rgba(0,0,0,.78);

    --tint-accent:hsl(226 92% 70%);
    --tint-text:hsl(226 80% 78%);
    --tint-soft:hsl(226 92% 70% / .20);
    --tint-line:hsl(226 92% 70% / .38);
    --tint-box:hsl(226 92% 70% / .62);
    --tint-card:hsl(226 92% 70% / .26);
    --tint-fill:hsl(226 92% 68%);

    --glow-1:hsl(226 100% 62% / .26);
    --glow-2:hsl(226 92% 60% / .20);

    --subject-color:#7C93FF;
  }
  /* 组件规则：亮 / 暗共用（只引 token，没有写死的颜色） */
  :root[data-hw-skin="deepseek"] h1{
    font-family:var(--sans);
    font-weight:700;
    font-size:clamp(32px,6.4vw,66px);
    line-height:1.05;
    letter-spacing:-.03em;
  }
  :root[data-hw-skin="deepseek"] .kicker{
    color:var(--ink-soft);
    font-size:11px;
    letter-spacing:.24em;
  }
  :root[data-hw-skin="deepseek"] .kicker::before{
    width:7px; height:7px;
    border-radius:var(--radius-xs);
    background:var(--cta-bg);
  }
  :root[data-hw-skin="deepseek"] .subtitle{
    border-left-color:var(--cta-bg);
    font-family:var(--sans);
    font-size:clamp(15px,2.1vw,19px);
    letter-spacing:.01em;
  }
  :root[data-hw-skin="deepseek"] .card{
    border:1px solid var(--line);
    box-shadow:0 1px 2px var(--shadow-1);
  }
  :root[data-hw-skin="deepseek"] thead th{
    background:transparent;
    color:var(--ink-soft);
    letter-spacing:.14em;
    border-bottom:1px solid var(--line);
  }
  :root[data-hw-skin="deepseek"] tbody tr:hover{
    background:color-mix(in srgb, var(--cta-bg) 5%, transparent);
  }
  :root[data-hw-skin="deepseek"] .subject{
    font-family:var(--sans);
    letter-spacing:.02em;
  }
  :root[data-hw-skin="deepseek"] .progress-track{
    background:color-mix(in srgb, var(--ink) 8%, transparent);
  }
  :root[data-hw-skin="deepseek"] .notice{
    background:color-mix(in srgb, var(--cta-bg) 8%, transparent);
    border-color:var(--mark-border);
    color:var(--ink);
  }
  :root[data-hw-skin="deepseek"] .notice code{
    background:color-mix(in srgb, var(--cta-bg) 12%, transparent);
    color:var(--ink);
  }
  :root[data-hw-skin="deepseek"] .note{
    background:color-mix(in srgb, var(--cta-bg) 5%, var(--paper));
    border-color:var(--line);
    box-shadow:0 1px 2px var(--shadow-1);
  }
  :root[data-hw-skin="deepseek"] .note::before{ background:var(--cta-bg); }
  :root[data-hw-skin="deepseek"] .note-label{
    color:var(--cta-bg);
    letter-spacing:.18em;
  }
  :root[data-hw-skin="deepseek"] .note-text{ color:var(--ink); }
  :root[data-hw-skin="deepseek"] .note-text th,
  :root[data-hw-skin="deepseek"] .note-text td{
    border-color:var(--line);
    color:var(--ink);
  }
  :root[data-hw-skin="deepseek"] .note-text th{ background:var(--thead-bg); }

  /* 极简 = 别让纸张底纹喧宾夺主：把底纹那层纱压到几乎不透明（还留一点点质感）。
     「切换背景」按钮仍然有效，只是视觉权重降下来了。 */
  :root[data-hw-skin="deepseek"] .bg::after{ --bg-veil:92%; }
  :root[data-hw-skin="deepseek"][data-appearance="dark"] .bg::after{ --bg-veil:95%; }

  /* ============================================================
     布局系统：normal（现在的，一列到底）/ two（一行两个科目）
     ------------------------------------------------------------
     two 只是把 tbody 变成两列网格、每一行（科目）变成一张小卡片 ——
     **DOM 一个节点都不动**（table > tbody > tr[data-subject] > td），所以：
       · Tab 顺序、勾选逻辑（.hw-item）、进度、时光机、更新日志全都不受影响
       · 滚动轨道上的科目刻度在双栏下会两两叠在一起，索性藏掉（thumb 还在）
       · 手机上（≤767px）那段媒体查询里会把 two 再压回单栏，不硬塞
     ============================================================ */
  :root[data-hw-layout="two"] .card{
    background:transparent;
    border:0;
    border-radius:0;
    box-shadow:none;
    overflow:visible;
  }
  :root[data-hw-layout="two"] thead{ display:none; }
  :root[data-hw-layout="two"] tbody{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:14px;
  }
  :root[data-hw-layout="two"] tbody tr{
    display:block;
    padding:0;                       /* 内距交给两个格子：科目色带才能贴住卡片上沿 */
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    box-shadow:0 1px 2px var(--shadow-1);
    overflow:hidden;                 /* 让色带的直角被卡片圆角裁掉 */
  }
  :root[data-hw-layout="two"] tbody tr:hover{
    background:color-mix(in srgb, var(--tint-accent) 5%, var(--paper));
    border-color:color-mix(in srgb, var(--tint-accent) 30%, var(--line));
  }
  :root[data-hw-layout="two"] tbody td{
    display:block;
    padding:0 16px;
    border:0;
    transition:none;
  }
  :root[data-hw-layout="two"] tbody tr:last-child td{ border-bottom:0; }
  /* 第一格 = 科目色带（底色是上面 tbody td:first-child 那层 --hw-tint，这里只调内距） */
  :root[data-hw-layout="two"] tbody td:first-child{
    padding:10px 16px 9px;
    margin-bottom:0;
  }
  :root[data-hw-layout="two"] tbody td:last-child{ padding:11px 16px 13px; }
  :root[data-hw-layout="two"] .rail-mark{ display:none; }

  /* ============================================================
     留言板（只在这一页）
     ------------------------------------------------------------
     数据：`class/data/msg-api.php`（热铁盒 = PHP 云函数 + KV 数据库），
     按**今天这份作业的日期**归档，所以每天各一块，旧留言不会挤在新作业下面。

     降级（这是重点，别改成「拿不到就报错」）：
       热铁盒        .php 真执行 → 云端留言
       GitHub Pages  .php 被当源码返回（text/plain）→ 解析不出 JSON → 本机留言
       桌面 / 安卓离线副本  .php 一律 404        → 本机留言
     页面只认「有没有拿到合法 JSON」，拿不到就把这一块切成「本机」，
     存在 localStorage['hw.msg.local.<date>']，并说明它只在这台设备上。

     颜色全走 token：纸感 / DeepSeek 两套皮肤、亮 / 暗两种外观都不用另写规则。
     ★ 类名不叫 .card：双栏布局（data-hw-layout=two）会把 .card 拆掉，
       留言板跟排版无关，不想被拆。
     ============================================================ */
  .msg{
    margin-top:18px;
    padding:clamp(15px,2.4vw,22px) clamp(15px,2.6vw,24px);
    background:var(--paper);
    border:1px solid var(--tint-card);
    border-radius:var(--radius-card);
    box-shadow:
      0 1px 2px var(--shadow-1),
      0 22px 46px -36px var(--shadow-2);
    transition:border-color .5s ease, background .3s ease, box-shadow .3s ease;
  }
  .msg-head{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .msg-head h2{
    margin:0;
    font-family:var(--serif);
    font-weight:500;
    font-size:19px;
    letter-spacing:.01em;
    color:var(--ink);
  }
  .msg-state{
    margin-left:auto;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:2px 9px;
    border:1px solid var(--tint-line);
    border-radius:var(--radius-badge);
    background:var(--tint-soft);
    color:var(--tint-text);
    font-size:11.5px;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .msg-state::before{
    content:"";
    flex:none;
    width:5px;height:5px;
    border-radius:var(--radius-dot);
    background:currentColor;
    opacity:.8;
  }
  .msg-state[data-mode="local"]{ color:var(--oak); }
  .msg-state[data-mode="error"]{ color:var(--clay); }

  .msg-hint{
    margin:6px 0 12px;
    font-size:12.5px;
    line-height:1.7;
    color:var(--ink-soft);
  }

  .msg-form{ display:grid; gap:9px; }
  .msg-row{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
  }
  .msg-label{
    font-size:11.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--oak);
  }
  .msg select,
  .msg input[type="password"]{
    min-height:36px;
    padding:0 10px;
    border:1px solid var(--tint-line);
    border-radius:var(--radius-control);
    background:var(--tint-soft);
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    transition:border-color .18s ease, background .18s ease;
  }
  .msg input[type="password"]{ width:132px; letter-spacing:.18em; }
  .msg select:hover,
  .msg input[type="password"]:hover{ border-color:var(--tint-accent); }
  .msg select:focus-visible,
  .msg input[type="password"]:focus-visible,
  .msg textarea:focus-visible{
    outline:2px solid var(--tint-accent);
    outline-offset:2px;
  }
  .msg textarea{
    width:100%;
    min-height:62px;
    padding:10px 12px;
    border:1px solid var(--tint-line);
    border-radius:var(--radius-control);
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    font-size:14.5px;
    line-height:1.65;
    resize:vertical;
    transition:border-color .18s ease;
  }
  .msg textarea::placeholder{ color:var(--empty-text); }

  .msg-btn{
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:36px;
    padding:0 14px;
    border:1px solid var(--tint-line);
    border-radius:var(--radius-control);
    background:var(--tint-soft);
    color:var(--tint-text);
    font-family:inherit;
    font-size:13px;
    letter-spacing:.03em;
    transition:background .18s ease, border-color .18s ease, color .18s ease;
  }
  .msg-btn:hover{ background:var(--tint-card); border-color:var(--tint-accent); }
  .msg-btn:focus-visible{ outline:2px solid var(--tint-accent); outline-offset:3px; }
  .msg-btn.primary{
    background:var(--cta-bg);
    border-color:transparent;
    color:#FFFCF7;
  }
  .msg-btn.primary:hover{ background:var(--cta-bg-hover); }
  .msg-btn[disabled]{
    cursor:not-allowed;
    background:var(--tint-soft);
    border-color:var(--tint-line);
    color:var(--empty-text);
  }
  .msg-btn[disabled]:hover{
    background:var(--tint-soft);
    border-color:var(--tint-line);
    color:var(--empty-text);
  }
  .msg-btn.primary[disabled]{
    background:var(--tint-soft);
    border-color:var(--tint-line);
    color:var(--empty-text);
  }
  .msg-btn.primary[disabled]:hover{
    background:var(--tint-soft);
    border-color:var(--tint-line);
  }

  .msg-count{
    margin-left:auto;
    font-size:11.5px;
    color:var(--foot-text);
    font-variant-numeric:tabular-nums;
  }

  .msg-list{
    margin:14px 0 0;
    padding:0;
    list-style:none;
  }
  .msg-item{
    display:grid;
    grid-template-columns:28px minmax(0,1fr) auto;
    gap:10px;
    align-items:start;
    padding:11px 2px;
    border-top:1px solid var(--line-soft);
  }
  .msg-item:first-child{ border-top:0; }
  .msg-av{
    width:28px;height:28px;
    display:grid;place-items:center;
    border-radius:var(--radius-dot);
    background:var(--tint-soft);
    color:var(--tint-text);
    font-size:12.5px;
    font-weight:600;
    line-height:1;
  }
  .msg-body{ min-width:0; }
  .msg-meta{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .msg-nm{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
  }
  .msg-tm{
    font-size:11.5px;
    color:var(--foot-text);
    font-variant-numeric:tabular-nums;
  }
  .msg-tx{
    margin:3px 0 0;
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .msg-del{
    cursor:pointer;
    min-height:30px;
    padding:0 9px;
    border:1px solid var(--tint-line);
    border-radius:var(--radius-sm);
    background:transparent;
    color:var(--oak);
    font-family:inherit;
    font-size:11.5px;
    transition:background .16s ease, border-color .16s ease, color .16s ease;
  }
  .msg-del:hover{ background:var(--tint-soft); border-color:var(--clay); color:var(--clay); }
  .msg-del:focus-visible{ outline:2px solid var(--tint-accent); outline-offset:2px; }

  .msg-empty{
    margin:14px 0 0;
    font-size:13px;
    color:var(--foot-text);
  }
  .msg-empty[hidden]{ display:none; }

  /* ============================================================
     小提示条：截图成功 / 失败、换外观 / 换布局时的一句反馈
     ------------------------------------------------------------
     固定底部居中，压在两个弹窗（60/70）之上；平时 visibility:hidden 不占位、
     不吃点击。带 env(safe-area-inset-bottom)，iPhone 的 home 条不会盖住它。
     ============================================================ */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    z-index:80;
    max-width:min(92vw, 420px);
    padding:10px 16px;
    border:1px solid var(--tint-line);
    border-radius:var(--radius-control);
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    color:var(--ink);
    font-size:13px;
    line-height:1.5;
    text-align:center;
    box-shadow:0 10px 30px -18px var(--shadow-3);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    transform:translate(-50%, 10px);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:
      opacity var(--dur-base) var(--ease-out),
      transform var(--dur-base) var(--ease-out),
      visibility 0s linear var(--dur-base);
  }
  .toast.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%, 0);
    transition:
      opacity var(--dur-base) var(--ease-out),
      transform var(--dur-base) var(--ease-out),
      visibility 0s;
  }
  @media (prefers-reduced-motion: reduce){
    .toast, .toast.show{ transition:none; }
  }

  /* ============================================================
     响应式：桌面 / 平板 / 手机
     ============================================================
     断点（与全站一致，只写在下面这一段里）：
       桌面       ≥ 1024px  —— 下面一律不碰
       平板   768 – 1023px  —— 紧凑版
       手机        ≤ 767px  —— 重点适配
       手机窄屏    ≤ 400px  —— 小屏微调

     规矩：
       ① 全部用 max-width 覆盖，桌面端一条规则都不命中 —— 视觉与交互和改造前逐像素一致。
       ② 不写死颜色，一律走上面的 token。
       ③ 触摸目标 ≥ 48px；touch 没有 hover，`active` 与 `hover` 成对写。
       ④ 底部固定元素（底部动作面板 / 播放类）给 env(safe-area-inset-*) 留位。
       ⑤ <768px 时「更多811工具」栏不藏、只改摆放：整条沉到底部当动作面板，
          桌面那 4 个按钮原样搬进去（同一个 DOM，没有第二份标记、也没有 JS 生成的副本）。
          这样 Tab 顺序天然正确，不用 CSS order 去改视觉序。
      ============================================================ */

  /* ---------- 底部动作面板的遮罩与把手（桌面不存在，只有手机用得上） ---------- */
  .head-acts::before,      /* 面板顶部的抓握把手 */
  .head-acts::after{       /* 整屏遮罩：面板背后那层，点了就收 */
    content:"";
    position:fixed;
    pointer-events:none;
  }
  .head-acts::after{
    inset:0;
    z-index:-1;                          /* 落在面板之下、正文之上 */
    background:var(--overlay);
    opacity:0;
    transition:opacity var(--dur-base) var(--ease-out);
  }
  /* ★ 手机上的面板开关：由 JS 插进 .head-acts，是这一栏的第一个孩子 —— 既在
       桌面 Tab 顺序里排第一（顺序不变），打开面板后 Tab 进面板第一站也是它。 */
  /* ★★ 手机上的面板开关。**它是 `.head-acts` 的兄弟，不是它的孩子** ——
     原因是手机上面板用 `transform:translate3d(0, calc(100% + 14px), 0)` 滑出屏幕，
     而**有 transform 的祖先会成为 position:fixed 后代的包含块**：
     开关若留在面板里，即使 `position:fixed` 也会被钉在那条已经移出屏幕的坐标系里，
     可见面积 = 0（DevTools 报「element not visible」，但源码、选择器、DOM 全都正常）。
     这是「fixed 一定相对视口」这个直觉最容易翻车的地方，写在这儿免得以后有人又把它挪进去。
     （也顺带避开了 `visibility` 继承：面板收起时整条是 visibility:hidden，
       孩子会被继承到 hidden —— 挪出来就没这回事了。） */
  .acts-toggle{
    display:none;                        /* 桌面永不显示 */
    cursor:pointer;
    flex:none;
    align-items:center;
    justify-content:center;
    width:44px; height:44px;
    padding:0;
    border:1px solid var(--tint-line);
    border-radius:var(--radius-control);
    background:var(--paper);
    color:var(--tint-text);
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 6px 18px -12px var(--shadow-2);
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .acts-toggle svg{ width:18px; height:18px; }
  .acts-toggle:active{ background:var(--tint-card); color:var(--ink); }
  .acts-toggle:focus-visible{ outline:2px solid var(--tint-accent); outline-offset:2px; }

  @media (max-width:1023px){
    /* 平板：内容窄一点、留白收一档，其余照旧 */
    .page{ max-width:100%; }
    .hw-list{ gap:12px; }
  }

  @media (max-width:767px){
    /* ---------- 版面留白与安全区 ---------- */
    body{
      padding:
        max(clamp(20px,5.4vw,28px), env(safe-area-inset-top))
        max(clamp(16px,4.6vw,20px), env(safe-area-inset-right))
        calc(96px + env(safe-area-inset-bottom))
        max(clamp(16px,4.6vw,20px), env(safe-area-inset-left));
    }
    html.hw-rail-on body{
      /* 手机上的自绘轨道贴着屏幕右边，内容的右留白已经够，不再叠补偿 */
      padding-right:max(clamp(16px,4.6vw,20px), env(safe-area-inset-right));
    }
    html{ scrollbar-gutter:auto; }        /* 触屏是 overlay 滚动条，常驻槽位只会多留一条白 */

    .head{ margin-bottom:20px; }
    .head-top{ margin-bottom:12px; }
    h1{ font-size:clamp(25px,7.4vw,32px); line-height:1.3; }
    .subtitle{
      margin-top:10px;
      padding-left:11px;
      font-size:15px;
      line-height:1.7;
    }
    .meta{ margin-top:13px; gap:9px; font-size:13px; }
    .progress-track{ margin-top:13px; height:6px; }   /* 细进度条在手机上也有 6px，看得见 */

    /* ---------- ★ 底部动作面板 ---------- */
    .head-acts{
      position:fixed;
      left:0; right:0; bottom:0;
      z-index:55;                          /* 正文与滚动轨道之上、两个弹窗（60/70）之下 */
      max-height:min(76vh, 560px);
      overflow-y:auto;
      overscroll-behavior:contain;
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      margin:0;
      padding:20px max(clamp(16px,4.6vw,22px), env(safe-area-inset-right))
              calc(18px + env(safe-area-inset-bottom))
              max(clamp(16px,4.6vw,22px), env(safe-area-inset-left));
      background:var(--paper);
      border-top:1px solid var(--line);
      border-radius:var(--radius-modal) var(--radius-modal) 0 0;
      box-shadow:0 -22px 48px -30px var(--shadow-3);
      transform:translate3d(0, calc(100% + 14px), 0);
      visibility:hidden;
      transition:
        transform var(--dur-base) var(--ease-out),
        visibility 0s linear var(--dur-base);
    }
    .head-acts::before{
      position:absolute;
      top:8px; left:50%;
      transform:translateX(-50%);
      width:38px; height:4px;
      border-radius:var(--radius-pill);
      background:var(--line);
    }
    .head-acts.on{
      transform:translate3d(0,0,0);
      visibility:visible;
      transition:transform var(--dur-base) var(--ease-out), visibility 0s;
    }
    .head-acts.on::after{ opacity:1; pointer-events:auto; }

    /* 面板里每一项都拉满一行：手指够得着、图标文字对齐一致 */
    .head-acts > .more-btn{
      width:100%;
      min-height:50px;
      justify-content:flex-start;
      gap:11px;
      padding:0 14px;
      font-size:15px;
      border-radius:var(--radius-control);
      background:var(--tint-soft);
      border-color:var(--tint-line);
    }
    .head-acts > .more-btn svg{ width:18px; height:18px; }
    /* ★★ 开关的「出生地」：基础规则里是 display:none（桌面永不显示），这一档翻成 flex。
       它**不在面板里**（见上面基础段的长注释：面板带 transform，会把它钉在屏幕外），
       所以这里不用再跟继承下来的 visibility 打架。 */
    .acts-toggle{
      display:flex;
      position:fixed;                       /* 相对视口 —— 它现在没有带 transform 的祖先了 */
      right:max(clamp(14px,4.2vw,18px), env(safe-area-inset-right));
      bottom:calc(16px + env(safe-area-inset-bottom));
      z-index:56;                           /* 比面板（55）高一层，面板开着也点得到 */
    }
    /* 面板打开时开关变成「收起」：同一枚按钮，图形换成向下的箭头由 JS 换 */
    .acts-toggle.on{
      background:var(--tint-card);
      border-color:var(--tint-accent);
      color:var(--ink);
    }
    /* 触摸没有 hover：把悬停位移去掉，给按压态 */
    .head-acts > .more-btn:hover{ transform:none; background:var(--tint-card); }
    .head-acts > .more-btn:active{
      transform:scale(.99);
      background:var(--tint-card);
      border-color:var(--tint-accent);
    }

    /* ---------- 作业表：一列到底 ---------- */
    .card{ border-radius:var(--radius-card); }
    thead{ display:none; }
    table, tbody, tr, td{ display:block; width:100%; }
    tbody tr{
      border-bottom:1px solid var(--line);
      padding:0 0 4px;
    }
    tbody tr:last-child{ border-bottom:none; }
    tbody td{
      border:none;
      padding:10px max(clamp(14px,4.4vw,18px), env(safe-area-inset-left)) 10px
              max(clamp(14px,4.4vw,18px), env(safe-area-inset-right));
    }
    tbody tr[data-subject] td:first-child{
      min-height:56px;
      padding-top:14px;
      padding-bottom:10px;
      border-bottom:1px solid var(--line-soft);
    }
    tbody tr[data-subject] td:last-child{ padding-top:12px; padding-bottom:16px; }
    .subject{ font-size:15px; }
    .subject .ico{ width:19px; height:19px; }

    /* ---------- 双栏布局在手机上压回单栏 ----------
       手机屏幕放两列只会把字挤成竖条，所以 two 在这一档等于 normal：
       去掉「每科一张小卡片」的外壳，恢复成上面那套一列到底。
       （特异性要压过外面那段 :root[data-hw-layout="two"]，所以前缀照写。） */
    :root[data-hw-layout="two"] .card{
      background:var(--paper);
      border:1px solid var(--tint-card);
      border-radius:var(--radius-card);
      box-shadow:0 1px 2px var(--shadow-1), 0 26px 52px -34px var(--shadow-2);
      overflow:hidden;
    }
    :root[data-hw-layout="two"] tbody{ display:block; }
    :root[data-hw-layout="two"] tbody tr{
      padding:0 0 4px;
      background:transparent;
      border:0;
      border-bottom:1px solid var(--line);
      border-radius:0;
      box-shadow:none;
    }
    :root[data-hw-layout="two"] tbody tr:hover{
      background:transparent;
      border-color:var(--line);
    }
    :root[data-hw-layout="two"] tbody tr:last-child{ border-bottom:none; }
    :root[data-hw-layout="two"] tbody td{
      padding:10px max(clamp(14px,4.4vw,18px), env(safe-area-inset-left)) 10px
              max(clamp(14px,4.4vw,18px), env(safe-area-inset-right));
    }
    :root[data-hw-layout="two"] tbody td:first-child{ margin-bottom:0; }
    :root[data-hw-layout="two"] tbody tr[data-subject] td:first-child{
      min-height:56px;
      padding-top:14px;
      padding-bottom:10px;
      border-bottom:1px solid var(--line-soft);
    }
    :root[data-hw-layout="two"] tbody tr[data-subject] td:last-child{
      padding-top:12px;
      padding-bottom:16px;
    }

    /* 小提示条：抬到底部动作开关（.acts-toggle）上面，别压住它 */
    .toast{ bottom:calc(76px + env(safe-area-inset-bottom, 0px)); }

    /* 条目行做成整行可点：命中区 ≥ 48px，勾选框跟着行高走 */
    .hw-list{ gap:4px; }
    .hw-item{
      min-height:48px;
      align-items:flex-start;
      gap:12px;
      padding:11px 6px;
      border-radius:var(--radius-md);
      -webkit-touch-callout:none;
    }
    .hw-item:active{ background:var(--tint-soft); }
    .box{
      width:22px; height:22px;
      margin-top:2px;                      /* 22px 方框对准第一行文字的中线 */
      border-width:1.8px;
      border-radius:var(--radius-sm);
    }
    .box svg{ width:13px; height:13px; }
    .text{ font-size:16px; line-height:1.72; }   /* 正文 ≥16px：iOS 不自动放大 */

    /* ---------- 便签 ---------- */
    .note{ padding:15px 16px; }

    /* ---------- 页脚 ---------- */
    .foot{ margin-top:20px; font-size:12px; line-height:1.8; }

    /* ---------- 顶部收缩状态条：手机上不吃掉整行 ---------- */
    .sb{ padding:10px max(clamp(14px,4.4vw,18px), env(safe-area-inset-left)) 10px
                  max(clamp(14px,4.4vw,18px), env(safe-area-inset-right)); }
    .sb-title{ font-size:13px; }

    /* ---------- 滚动轨道：手指粗，刻度加大 ---------- */
    .rail-mark{ height:22px; }
    .rail-mark > i{ width:7px; height:7px; }
    .rail-mark::after{ display:none; }     /* 触屏没有 hover，悬停标签不出场（省得挡住正文） */

    /* ---------- 弹窗 / 抽屉：手机近全屏 ---------- */
    .congrats,
    .logwin{ padding:max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
    .congrats-card{
      width:100%;
      padding:clamp(22px,6.4vw,30px) clamp(18px,5vw,24px);
      border-radius:var(--radius-modal);
    }
    .congrats-btn{ width:100%; min-height:50px; }   /* 主按钮整宽，手指好按 */

    .logwin-card{
      width:100%;
      max-height:calc(100dvh - max(24px, env(safe-area-inset-top)) - max(24px, env(safe-area-inset-bottom)));
      max-height:calc(100vh - max(24px, env(safe-area-inset-top)) - max(24px, env(safe-area-inset-bottom)));
      border-radius:var(--radius-modal);
    }
    .logwin-head{
      padding:12px 10px 12px max(14px, env(safe-area-inset-left));
      flex-wrap:wrap;
      row-gap:4px;
    }
    .logwin-title{ font-size:15px; }
    .logwin-close{ width:48px; height:48px; }        /* 触摸目标：手指点得着（规范下限 48dp） */
    /* 更新日志：日期列表折到顶部、横向滑，正文占满下面 */
    .logwin-body{
      grid-template-columns:1fr;
      grid-template-rows:auto minmax(0,1fr);
    }
    .logwin-list{
      flex-direction:row;
      gap:7px;
      padding:10px max(12px, env(safe-area-inset-left));
      border-right:0;
      border-bottom:1px solid var(--line-soft);
      overflow-x:auto;
      overflow-y:hidden;
      overscroll-behavior-x:contain;
      -webkit-overflow-scrolling:touch;
    }
    .log-item{
      flex:none;
      width:auto;
      max-width:220px;
      min-height:48px;                              /* 触摸目标 */
      justify-content:center;
      padding:9px 12px;
      border-color:var(--tint-line);
      background:var(--tint-soft);
    }
    .logwin-detail{ padding:16px max(14px, env(safe-area-inset-left)) 22px; }
    .log-h{ font-size:17.5px; }
    .tm-more{ min-height:48px; width:100%; }
    .tm-items li{ min-height:32px; padding-top:3px; padding-bottom:3px; }

    /* ---------- 彩蛋两侧竖排字：小屏挤不下，收窄字号与间距 ---------- */
    .easter-text{ font-size:14.5px; letter-spacing:.22em; }
    .easter-text.left{ left:10px; }
    .easter-text.right{ right:10px; }

    /* ---------- 留言板：触摸目标 ≥ 48px，名字选择器整行宽 ---------- */
    .msg{ padding:15px 14px; margin-top:16px; }
    .msg-head h2{ font-size:17.5px; }
    .msg-state{ margin-left:0; }
    .msg select{ width:100%; min-height:48px; font-size:15px; }
    .msg input[type="password"]{ width:100%; min-height:48px; font-size:15px; }
    .msg textarea{ min-height:88px; font-size:15.5px; }
    .msg-btn{ min-height:48px; font-size:14px; }
    .msg-btn.primary{ flex:1; }
    .msg-count{ margin-left:0; width:100%; text-align:right; }
    .msg-item{ grid-template-columns:26px minmax(0,1fr); row-gap:6px; }
    .msg-del{ grid-column:2; justify-self:start; min-height:38px; }
    .msg-tx{ font-size:15px; }
  }

  @media (max-width:400px){
    body{
      padding:
        max(18px, env(safe-area-inset-top))
