name: 作业修改自动推送

on:
  push:
    paths:
      - 'data/homework.json' # 只在 homework.json 被修改时触发
  workflow_dispatch: # 保留手动测试按钮

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 检查代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 拉取最近2次提交，用于对比差异（可选）

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: pip install requests

      - name: 执行推送脚本
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_SECRET: ${{ secrets.WX_SECRET }}
          WX_TEMPLATE_ID: ${{ secrets.WX_TEMPLATE_ID }}
        run: python push_homework.py

      # 自动提交哈希文件，防止下次重复推送
      - name: 提交哈希记录
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_push_hash.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "更新推送哈希记录 [skip ci]"
          git push
